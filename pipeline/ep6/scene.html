  if(kind==='nose') s=`<circle r="30" fill="#E2A77E" stroke="${OL}" stroke-width="4"/><path d="M0,-8 Q8,8 0,10" stroke="${OL}" stroke-width="4" fill="none"/><path d="M4,14 c3,8 5,12 0,15 c-5,-3 -3,-7 0,-15z" fill="#9FD6F5" stroke="${OL}" stroke-width="2"/>`;
  if(kind==='walk') s=`<circle r="34" fill="#3FB27F" stroke="#fff" stroke-width="5"/><path d="M-16,0 L-4,13 L18,-13" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  if(kind==='fever') s=thermo(-10,6,0.4,39,false).replace(/<text[^]*?<\/text>/,'');
  if(kind==='bed') s=`<g transform="scale(.55)">${bedIcon()}</g>`;
  if(kind==='lungs') s=`<path d="M-6,-26 L-6,0 C-20,-8 -34,4 -32,22 C-30,34 -14,34 -6,24Z M6,-26 L6,0 C20,-8 34,4 32,22 C30,34 14,34 6,24Z" fill="#EE93AE" stroke="${OL}" stroke-width="4"/>`;
  if(kind==='help') s=`<circle r="32" fill="#E5383B" stroke="#fff" stroke-width="5"/><path d="M0,-18 L0,18 M-18,0 L18,0" stroke="#fff" stroke-width="10"/>`;
  return `<g transform="scale(${sc})">${s}</g>`;
}
function bedIcon(){return `<rect x="-60" y="-6" width="120" height="30" rx="8" fill="#7FB8D8" stroke="${OL}" stroke-width="4"/><rect x="-56" y="-22" width="36" height="18" rx="8" fill="#fff" stroke="${OL}" stroke-width="4"/><path d="M-60,24 L-60,36 M60,24 L60,36" stroke="${OL}" stroke-width="6"/><text x="16" y="-14" font-size="28" font-weight="800" fill="#2a2018">Zz</text>`}
function gymBag(x,y,sc){return `<g transform="translate(${x},${y}) scale(${sc})"><path d="M-30,-40 Q0,-70 30,-40" stroke="${OL}" stroke-width="8" fill="none"/><rect x="-60" y="-40" width="120" height="60" rx="24" fill="#2D3550" stroke="${OL}" stroke-width="4"/><path d="M-40,-10 L40,-10" stroke="#F6C945" stroke-width="5"/></g>`}
function walkingLegs(x,y,ph,sc){ let s='';[-18,18].forEach((lx,i)=>{const sw=Math.sin(ph*Math.PI*2+i*Math.PI)*16, lift=Math.max(0,Math.sin(ph*Math.PI*2+i*Math.PI))*8;
  s+=`<path d="M${lx},-66 L${lx+sw},${-6-lift}" stroke="${OL}" stroke-width="32" stroke-linecap="round"/><path d="M${lx},-66 L${lx+sw},${-6-lift}" stroke="${HERO.pants}" stroke-width="24" stroke-linecap="round"/><ellipse cx="${lx+sw+4}" cy="${-4-lift}" rx="19" ry="10" fill="${HERO.shoe}" stroke="${OL}" stroke-width="4"/>`});
  return g(`translate(${x},${y}) scale(${sc})`,`<rect x="-40" y="-84" width="80" height="26" rx="10" fill="${HERO.pants}" stroke="${OL}" stroke-width="4"/>`+s);}
function scene(t){
  let panel='', cam={s:1,x:540,y:304}, gray=false, over='', fine=null, raw=false, shake=0, rot=0;
  const M1=CLIP('m1'), N4=CLIP('n4'), H2=CLIP('h2'), M2=CLIP('m2'), M3=CLIP('m3'), M4=CLIP('m4');
  const pauseAt=M1.start-0.15, rwEnd=N4.start-0.05, rwStart=rwEnd-1.1;
  const FZ=PE('n3.2')-0.3;
  if(t<pauseAt){ const b=badPath(t); panel=b.panel; over=b.over; cam=b.cam; rot=b.rot; shake=b.shake; }
  else if(t<rwStart){ // ===== Mr Fine pause
    gray=true; const keep=T; T=FZ; const b=badPath(FZ); T=keep; panel=b.panel; cam=b.cam; rot=b.rot;
    over+=`<g opacity="${A(t,pauseAt,pauseAt+0.2)}"><rect x="34" y="34" width="14" height="46" fill="#fff"/><rect x="58" y="34" width="14" height="46" fill="#fff"/><text x="88" y="70" font-size="30" font-weight="800" fill="#fff">PAUSED</text></g>`;
    const d1=P_('m1.1'), rw=P_('m1.2'), L1=PE('m1.1')-d1;
    const e1=d1, e2=d1+L1*0.33, e3=d1+L1*0.62, e4=d1+L1*0.84;
    if(t>=d1&&t<rw) over+=`<rect x="400" y="0" width="680" height="608" fill="#141218" opacity="${0.65*A(t,d1,d1+0.3)}"/>`;
    if(t>=d1&&t<rw){
      over+=badge(740,70,'FEVER = BODY WORKING HARD',{sc:popS(t,e1+0.1),fs:28,bg:'#fff'});
      over+=thermo(600,290,popS(t,e1+0.3)*1.1,39+0.8*A(t,e2,e3+0.5),true);
      if(t>=e2) over+=badge(880,200,'+ EXERCISE',{sc:popS(t,e2),fs:28,bg:'#F6C945'})+heat(880,170,1);
      if(t>=e2+0.8) over+=badge(880,280,'= HOTTER',{sc:popS(t,e2+0.8),fs:28,bg:'#E5383B',fg:'#fff'});
      if(t>=e3) over+=`<g transform="translate(800,400) scale(${popS(t,e3)})"><path d="M0,-40 C14,-18 22,-4 22,10 C22,26 10,36 0,36 C-10,36 -22,26 -22,10 C-22,-4 -14,-18 0,-40Z" fill="#7CC4EA" stroke="#fff" stroke-width="5"/></g>`+badge(910,400,'LOSE WATER',{sc:popS(t,e3+0.1),fs:26,bg:'#fff'});
      if(t>=e4) over+=badge(740,530,'= GET SICKER',{sc:popS(t,e4),fs:30,bg:'#E5383B',fg:'#fff'});
    }
    const wi=A(t,pauseAt,pauseAt+0.9), fx=mix(-120,150,wi);
    let o={x:fx,y:575,s:0.86,mouth:fineMouth(),walk:t<pauseAt+0.9?(t*2)%1:null,armL:[-8,2],armR:[40,60],handR:'remote',
      emo:t<d1?'neutral':t<e3?'serious':t<rw?'worried':'happy'};
    if(t>=d1+0.3&&t<d1+1.6){o.armL=[-110,10];o.handL='point'}
    if(t>=rw){o.armR=[70,50];o.press=t>rw+0.2&&t<rw+0.6}
    fine=o;
  }
  else if(t<rwEnd){ // ===== rewind
    const k=L(t,rwStart,rwEnd); const back=mix(FZ,0.3,Math.pow(k,0.8));
    const keep=T; T=back; const b=badPath(back); T=keep;
    panel=b.panel; cam=b.cam; rot=b.rot; gray=k<0.4;
    over+=`<g><path d="M40,40 L60,58 L40,76Z M64,40 L84,58 L64,76Z" fill="#fff" transform="rotate(180,62,58)"/><text x="100" y="70" font-size="30" font-weight="800" fill="#fff">REWIND</text></g>`;
    for(let i=0;i<5;i++){const yy=(i*137+t*900)%608;over+=`<rect x="0" y="${yy}" width="1080" height="${6+i%3*4}" fill="#fff" opacity=".18"/>`}
    fine={x:150,y:575,s:0.86,armR:[70,50],handR:'remote',remoteAng:70,press:true,mouth:0,emo:'happy'};
  }
  else if(t<H2.start){ // ===== right move: home, bag stays, water, rest
    const a0=P_('n4.0'), a1=P_('n4.1'), a2=P_('n4.2'), a3=P_('n4.3'), a4=P_('n4.4'), a5=P_('n4.5');
    panel+=`<rect x="-900" y="-400" width="2900" height="1100" fill="#C9D7E8"/><rect x="-900" y="520" width="2900" height="400" fill="#A88B6E"/>`;
    panel+=`<rect x="760" y="60" width="200" height="170" rx="6" fill="#FFF3C4" stroke="#8A7A66" stroke-width="10"/><path d="M860,60 L860,230 M760,145 L960,145" stroke="#8A7A66" stroke-width="8"/>`;
    panel+=`<rect x="440" y="140" width="120" height="380" rx="6" fill="#B07A52" stroke="${OL}" stroke-width="5"/><circle cx="540" cy="340" r="9" fill="#F6C945" stroke="${OL}" stroke-width="3"/>`; // door
    const bagDown=t>=a2+0.7;
    let o=heroO({x:720,y:560,face:'sheepish',blink:blinkAt(T,1),sweat:1,lookX:-4,mouth:0});
    if(t<a2+0.7){ const k=A(t,a2,a2+0.6); o.armR=[mix(14,30,k),mix(0,10,k)]; o.holdR=(hx,hy)=>gymBag(hx,hy+44,0.7); o.lookX=t>=a2?6:-4; }
    else { o.armR=[12,-10]; }
    if(t>=a3){ o.armL=[mix(12,140,A(t,a3,a3+0.4)),mix(10,40,A(t,a3,a3+0.4))]; o.face='happy'; o.holdL=(hx,hy)=>`<path d="M${hx-14},${hy-44} L${hx+14},${hy-44} L${hx+10},${hy} L${hx-10},${hy}Z" fill="#BFE3F5" stroke="${OL}" stroke-width="4"/><rect x="${hx-11}" y="${hy-30}" width="22" height="28" fill="#7CC4EA" opacity=".8"/>`; }
    if(t<a1) o.face='sheepish'; else if(t<a3) o.face='neutral';
    panel+=person(o,HERO);
    if(bagDown) panel+=gymBag(830,548,0.9);
    over+=thermo(860,150,0.75,38.9,false);
    over+=badge(150,52,'STREAK: 99 DAYS',{sc:1,bg:'#2a2018',fg:'#F6C945',fs:26});
    if(t<a2) over+=badge(700,540,t<a1?'SAME MORNING':'SAME FEVER',{sc:popS(t,t<a1?a0:a1),fs:30,bg:'#fff'});
    else if(t<a3) over+=badge(700,540,'GYM BAG STAYS HOME',{sc:popS(t,a2),fs:30,bg:'#F6C945'})+(bagDown?stampX(830,520,50,popS(t,a2+0.8)):'');
    const ic=[[a3,'WATER','glass'],[a4,'REST','bed'],[a5,'SLEEP','bed']];
    ic.forEach(([ts,txt],i)=>{ if(t>=ts) over+=badge(600+i*170,540,txt,{sc:popS(t,ts),fs:32,bg:'#F6C945'})+stampCheck(600+i*170,470,popS(t,ts+0.15)*0.7)});
    fine={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<a2?'neutral':'happy',armR:t>=a3+0.3?[30,150]:[11,0],handR:t>=a3+0.5?'thumb':'',nod:t>a3&&t<a3+0.8};
    cam={s:1.3,x:mix(660,700,A(t,N4.start,H2.start)),y:380};
  }
  else if(t<M2.start){ // ===== hero resting in bed
    const r1=P_('h2.0'), r2=P_('h2.2');
    panel+=bedScene(t,{face:'happy',blink:t>r2+1.2?1:blinkAt(T,2),mouth:envOf('hero')});
    over+=badge(150,52,'DAY 99: REST DAY',{sc:popS(t,H2.start),bg:'#3FB27F',fg:'#fff',fs:26});
    over+=stampCheck(330,52,popS(t,H2.start+0.3)*0.6);
    if(t>=r2+1.0) over+=zzz(420,330,A(t,r2+1,r2+1.4));
    fine={x:150,y:575,s:0.86,mouth:0,emo:'neutral',smile:true};
    cam={s:mix(1.35,1.5,A(t,H2.start,M2.start)),x:mix(560,520,A(t,H2.start,M2.start)),y:380};
  }
  else if(t<M3.start){ // ===== punchline: legs walk away
    panel+=gymBG();
    panel+=`<rect x="-900" y="-400" width="2900" height="1100" fill="#1b1622" opacity=".35"/>`;
    const p0=M2.start, mid=p0+M2.dur*0.48;
    let o={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<mid?'serious':'happy'};
    if(t<mid){o.armL=[-110,10];o.handL='point'}
    else {o.wink=t>PE('m2.0')-0.5&&t<PE('m2.0')+0.25;o.armR=[30,150];o.handR='thumb'}
    fine=o;
    const lx=mix(620,1150,A(t,mid,M3.start+0.2));
    panel+=walkingLegs(lx,560,(t*1.8)%1,1.2);
    over+=badge(720,60,'LEG DAY',{sc:popS(t,p0+0.1),fs:32,bg:'#fff'})+stampX(720,60,40,popS(t,p0+0.6)*0.9);
    if(t>=mid) over+=badge(760,180,'BYE!',{sc:popS(t,mid),fs:34,bg:'#F6C945',rot:-6});
    cam={s:1,x:540,y:304};
  }
  else if(t<M4.start){ // ===== survival tip: neck check
    panel+=gymBG();
    panel+=`<rect x="-900" y="-400" width="2900" height="1100" fill="#1b1622" opacity=".85"/>`;
    const q=P_('m3.0'), a=P_('m3.1'), b=P_('m3.2'), c=P_('m3.3'), d=P_('m3.4'), e=P_('m3.5');
    let o={x:150,y:575,s:0.95,mouth:fineMouth(),emo:'serious'};
    if(t>=q+1&&t<M4.start-0.3){o.armR=[120,-10];o.handR='point'}
    fine=o;
    const rows=[[q-0.1,'NECK CHECK','#fff','neck'],[q+1.35,'RUNNY NOSE?','#fff','nose'],[a,'EASY WALK: OK','#3FB27F','walk'],[b,'FEVER, ACHES, COUGH?','#fff','fever'],[c,'REST','#F6C945','bed'],[d,'TROUBLE BREATHING?','#fff','lungs'],[e,'GET MEDICAL HELP','#E5383B','help']];
    rows.forEach(([ts,txt,bg,ic],i)=>{ if(t<ts) return; const sc=popS(t,ts); const y=50+i*84;
      over+=`<g transform="translate(0,${y})"><g transform="translate(440,0)">${iconRow(ic,sc*0.8)}</g>${badge(770,0,txt,{sc,fs:28,bg,fg:(bg==='#E5383B'||bg==='#3FB27F')?'#fff':'#2a2018'})}</g>`});
    cam={s:1.0,x:540,y:304};
  }
  else { // ===== end card
    const e0=M4.start-0.2;
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="url(#cardbg)"/>`;
    panel+=`<g opacity="${A(t,e0,e0+0.3)}"><text x="740" y="230" text-anchor="middle" font-size="98" font-weight="800" fill="#1C1A20" letter-spacing="-2">MR FINE</text>
      <text x="740" y="305" text-anchor="middle" font-size="50" font-weight="700" fill="#1f1b24" opacity="${A(t,e0+0.3,e0+0.6)}">Leg day can wait.</text>
      <g transform="translate(740,395) scale(${popS(t,P_('m4.1'))})"><text x="0" y="0" text-anchor="middle" font-size="60" font-weight="800" fill="#E86A90">YOUR LIFE CAN'T.</text></g></g>`;
    const m=fineMouth();
    fine={x:300,y:548,s:1.4,mouth:m,armR:t<P_('m4.1')?[150+Math.sin(t*14)*12,10]:[30,150],handR:t<P_('m4.1')?'':'thumb',wink:t>M4.start+M4.dur+0.4,emo:'neutral',smile:t>M4.start+M4.dur+0.3};
    cam={s:1.0,x:540,y:304};
  }
  if(fine) over=mrFine(fine)+over;
  return {panel,cam,gray,over,raw,shake,rot};
}

function stampCheck(x,y,sc){ if(sc<=0) return ''; return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="40" fill="#3FB27F" stroke="#fff" stroke-width="6"/><path d="M-18,0 L-5,14 L20,-14" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}


function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) rotate(${sc.rot||0}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;
  // banner
  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>
      <text x="540" y="548" text-anchor="middle" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">WHAT HAPPENS IF YOU</text>
      <text x="540" y="618" text-anchor="middle" font-size="47" font-weight="800" fill="#fff" letter-spacing="-1">GO TO THE GYM WITH THE FLU?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
</script></body></html>
