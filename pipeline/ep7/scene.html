    // hero backs away slowly from a5, keeps going during h2
    const hx=mix(800,930,A(t,a5,hE));
    let o=heroO({x:hx,y:560,face:'scared',lookX:-7,sweat:1,mouth:0});
    if(t>=a2) o.face='neutral';
    if(t>=a3){ const k=A(t,a3,a3+0.4); o.armL=[mix(12,-150,k),mix(10,-15,k)]; o.armR=[mix(-12,150,k),mix(-10,15,k)]; o.s=mix(1,1.06,k); }
    if(t>=a5 && t<hE) o.walk=((t-a5)*0.7)%1;
    if(t>=hS){ o.mouth=envOf('hero'); o.face='neutral'; }
    if(t>=hE-0.2) o.face='happy';
    // bear: standing, alert -> calms -> turns, walks away into the trees
    const leave=hE-0.9;
    let bo={x:400,y:560,s:1,angry:t<a4,blink:blinkAt(T,3),headSway:Math.sin(T*1.3)*3};
    if(t>=a4 && t<leave) bo.headRot=6*Math.sin((t-a4)*1.2); // curious look
    if(t>=leave){ const k=A(t,leave,M2.start+0.4); bo.flip=true; bo.walk=(t*1.1)%1; bo.x=mix(400,430,k); bo.y=mix(560,470,k); bo.s=mix(1,0.6,k); bo.bored=true; }
    panel+=bear(bo);
    panel+=person(o,HERO);
    over+=badge(170,52,'DISTANCE: 20 m',{sc:1,bg:'#2a2018',fg:'#F6C945',fs:26});
    if(t<a2) over+=badge(620,545,t<a1?'SAME TRAIL':'SAME BEAR',{sc:popS(t,t<a1?a0:a1),fs:30,bg:'#fff'});
    else if(t<a3) over+=badge(620,545,'RUN',{sc:popS(t,a2),fs:34,bg:'#fff'})+stampX(620,545,46,popS(t,a2+0.5));
    const ic=[[a3,'STAND TALL'],[a4,'TALK CALMLY'],[a5,'BACK AWAY SLOWLY']];
    ic.forEach(([ts,txt],i)=>{ if(t>=ts&&t<hS) over+=badge(640,90+i*70,txt,{sc:popS(t,ts),fs:28,bg:'#F6C945'})+stampCheck(460-(i===2?40:0),90+i*70,popS(t,ts+0.15)*0.5)});
    if(t>=hS) over+=badge(640,160,'CALM VOICE',{sc:popS(t,hS),fs:28,bg:'#fff'});
    fine={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<a2?'serious':'neutral',armR:[11,0],nod:t>a3&&t<a3+0.8};
    if(t>=hS){ fine.mouth=0; fine.emo='neutral'; }
    cam={s:1.0,x:540,y:304};
  }
  else if(t<M3.start){ // ===== punchline: too boring to chase
    panel+=forestBG();
    const p0=M2.start, b2=P_('m2.1'), cg=PE('m2.1')-0.9;
    let bo={x:mix(430,450,A(t,p0,M3.start)),y:mix(470,440,A(t,p0,M3.start)),s:mix(0.6,0.42,A(t,p0,M3.start)),flip:true,walk:(t*1.1)%1,bored:true};
    panel+=`<g opacity="${1-A(t,M3.start-0.6,M3.start)}">${bear(bo)}</g>`;
    let o=heroO({x:930,y:560,face:'happy',armL:[12,10],armR:[-12,-10],mouth:0});
    if(t>=b2) o.face='sheepish';
    panel+=person(o,HERO);
    for(let i=0;i<3;i++){const p=((T*0.7+i*0.33)%1); panel+=`<text x="${bo.x-20+p*30}" y="${bo.y-170*bo.s-p*60}" font-size="${22+p*18}" font-weight="800" fill="#fff" stroke="${OL}" stroke-width="4" paint-order="stroke" opacity="${(1-p)*A(t,p0,p0+0.4)}">z</text>`}
    let f={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<b2?'neutral':'happy'};
    if(t>=b2&&t<cg){f.armL=[-110,10];f.handL='point'}
    if(t>=cg){f.armR=[30,150];f.handR='thumb';f.wink=t>cg&&t<cg+0.9;}
    fine=f;
    over+=badge(760,90,'BEAR: NOT INTERESTED',{sc:popS(t,p0+0.1),fs:28,bg:'#fff'});
    if(t>=b2) over+=badge(760,190,'TOO BORING TO CHASE',{sc:popS(t,b2),fs:30,bg:'#F6C945',rot:-3});
    if(t>=cg) over+=badge(760,290,'ACHIEVEMENT: ALIVE',{sc:popS(t,cg),fs:28,bg:'#3FB27F',fg:'#fff'});
    cam={s:1.0,x:540,y:304};
  }
  else if(t<M4.start){ // ===== survival tip
    panel+=forestBG();
    panel+=`<rect x="-900" y="-400" width="3200" height="1100" fill="#1b1622" opacity=".85"/>`;
    const q=P_('m3.0'), a=P_('m3.1'), b=P_('m3.2'), c=P_('m3.3'), d=P_('m3.4'), e=P_('m3.5');
    let o={x:150,y:575,s:0.95,mouth:fineMouth(),emo:'serious'};
    if(t>=a&&t<M4.start-0.3){o.armR=[120,-10];o.handR='point'}
    fine=o;
    const rows=[[q-0.1,'IF YOU SEE A BEAR:','#fff','bear'],[a,"DON'T RUN",'#E5383B','norun'],[b,'STAND TALL','#F6C945','tall'],[c,'TALK CALMLY','#F6C945','talk'],[d,'BACK AWAY SLOWLY','#F6C945','back'],[e,'BEAR SPRAY READY','#3FB27F','spray']];
    rows.forEach(([ts,txt,bg,ic],i)=>{ if(t<ts) return; const sc=popS(t,ts); const y=60+i*96;
      over+=`<g transform="translate(0,${y})"><g transform="translate(440,0)">${tipIcon(ic,sc*0.8)}</g>${badge(770,0,txt,{sc,fs:30,bg,fg:(bg==='#E5383B'||bg==='#3FB27F')?'#fff':'#2a2018'})}</g>`});
    cam={s:1.0,x:540,y:304};
  }
  else { // ===== end card
    const e0=M4.start-0.2;
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="url(#cardbg)"/>`;
    panel+=`<g opacity="${A(t,e0,e0+0.3)}"><text x="740" y="230" text-anchor="middle" font-size="98" font-weight="800" fill="#1C1A20" letter-spacing="-2">MR FINE</text>
      <text x="740" y="305" text-anchor="middle" font-size="46" font-weight="700" fill="#1f1b24" opacity="${A(t,e0+0.3,e0+0.6)}">Your cardio can wait.</text>
      <g transform="translate(740,395) scale(${popS(t,P_('m4.1'))})"><text x="0" y="0" text-anchor="middle" font-size="60" font-weight="800" fill="#E86A90">YOUR LIFE CAN'T.</text></g></g>`;
    const m=fineMouth();
    fine={x:300,y:548,s:1.4,mouth:m,armR:t<P_('m4.1')?[150+Math.sin(t*14)*12,10]:[30,150],handR:t<P_('m4.1')?'':'thumb',wink:t>M4.start+M4.dur+0.4,emo:'neutral',smile:t>M4.start+M4.dur+0.3};
    cam={s:1.0,x:540,y:304};
  }
  if(fine) over=mrFine(fine)+over;
  return {panel,cam,gray,over,raw,shake,rot};
}
function tipIcon(kind,sc){ if(sc<=0) return ''; let s='';
  if(kind==='bear') s=`<g transform="scale(.32) translate(-40,90)">${bear({x:0,y:0,s:1,headSway:0})}</g>`;
  if(kind==='norun') s=`<circle r="34" fill="#E5383B" stroke="#fff" stroke-width="5"/><path d="M-16,-16 L16,16 M16,-16 L-16,16" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`;
  if(kind==='tall') s=`<circle cy="-20" r="13" fill="#E2A77E" stroke="${OL}" stroke-width="4"/><path d="M0,-6 L0,24 M0,0 L-20,-30 M0,0 L20,-30 M0,24 L-10,40 M0,24 L10,40" stroke="#F6C945" stroke-width="7" stroke-linecap="round"/>`;
  if(kind==='talk') s=`<rect x="-32" y="-26" width="64" height="42" rx="18" fill="#fff" stroke="${OL}" stroke-width="4"/><path d="M-10,16 L-18,32 L4,16" fill="#fff" stroke="${OL}" stroke-width="4"/><path d="M-16,-6 L16,-6" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  if(kind==='back') s=`<path d="M30,0 L-24,0 M-8,-16 L-26,0 L-8,16" stroke="#F6C945" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(kind==='spray') s=`<rect x="-14" y="-26" width="28" height="56" rx="8" fill="#E07A3A" stroke="${OL}" stroke-width="4"/><rect x="-8" y="-38" width="16" height="12" fill="#2a2018"/><path d="M10,-34 L36,-44 M10,-34 L38,-30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  return `<g transform="scale(${sc})">${s}</g>`;
}


function stampCheck(x,y,sc){ if(sc<=0) return ''; return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="40" fill="#3FB27F" stroke="#fff" stroke-width="6"/><path d="M-18,0 L-5,14 L20,-14" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}


function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) rotate(${sc.rot||0}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;
  // banner
  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>
      <text x="540" y="548" text-anchor="middle" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">WHAT HAPPENS IF YOU</text>
      <text x="540" y="618" text-anchor="middle" font-size="56" font-weight="800" fill="#fff" letter-spacing="-1">RUN FROM A BEAR?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
</script></body></html>
