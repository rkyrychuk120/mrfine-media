<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#08070a;width:1080px;height:1920px;overflow:hidden}
svg{display:block}
text{font-family:Inter,sans-serif}
</style>
<script src="timeline.js"></script>
</head><body>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ---------- helpers ----------
const OL='#3a2a24', OLF='#2a2330';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=v=>{v=clamp(v);return v*v*(3-2*v)};
const A=(t,a,b)=>sm((t-a)/(b-a));          // eased 0..1 between a and b
const L=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const pop=(t,a,d=0.35)=>{const k=clamp((t-a)/d);if(k<=0)return 0;return k>=1?1:1+Math.sin(k*Math.PI)*0.25*(1-k)+ (k<1? (k-1)*0 :0) - (1-sm(k))};
const popS=(t,a,d=0.3)=>{const k=clamp((t-a)/d);if(k<=0)return 0;return sm(k)*(1+0.18*Math.sin(k*Math.PI))};
const n1=(t,s=1)=>Math.sin(t*1.7*s)*0.5+Math.sin(t*2.9*s+1.3)*0.3+Math.sin(t*5.3*s+0.7)*0.2;
let T=0, FR=0, TREAL=0;
function warpT_unused(t){const P=TL.warp;for(let i=0;i<P.length-1;i++){const [a,oa]=P[i],[b,ob]=P[i+1];if(t<=b)return oa+(t-a)*(ob-oa)/Math.max(1e-6,b-a)}return P[P.length-1][1]}
function envOf(k){const e=TL.env[k];const i=Math.round(TREAL*30);return e[i]||0}
function fineMouth(){return Math.max(envOf('fine'),envOf('nar'))}
function blinkAt(t,seed){const p=(t+seed*1.37)%3.7;return p<0.12?1:0}
function g(tr,inner,extra=''){return `<g transform="${tr}" ${extra}>${inner}</g>`}

// ---------- arm ----------
function arm(sx,sy,a1,a2,col,skin,l1=50,l2=46,w=24,hand=''){
  const r=Math.PI/180;const ex=sx+Math.sin(a1*r)*l1, ey=sy+Math.cos(a1*r)*l1;
  const hx=ex+Math.sin((a1+a2)*r)*l2, hy=ey+Math.cos((a1+a2)*r)*l2;
  const p=`M${sx},${sy} L${ex},${ey} L${hx},${hy}`;
  return {svg:`<path d="${p}" fill="none" stroke="${OL}" stroke-width="${w+8}" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${p}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="${hx}" cy="${hy}" r="13" fill="${skin}" stroke="${OL}" stroke-width="4"/>${hand}`,hx,hy};
}
// ---------- props (ep3: frozen pond) ----------
function phoneProp(hx,hy,rot=0,rec=false){
  const t=T; const on=rec&&(Math.floor(t*2)%2===0);
  return `<g transform="translate(${hx},${hy}) rotate(${rot})"><rect x="-13" y="-40" width="26" height="46" rx="5" fill="#26232c" stroke="${OL}" stroke-width="3.5"/><rect x="-9" y="-35" width="18" height="34" rx="2" fill="#7FC4E8"/>${rec?`<circle cx="0" cy="-27" r="4" fill="${on?'#ff3b30':'#7a2222'}"/>`:''}<circle r="12" fill="#C98D63" stroke="${OL}" stroke-width="4"/></g>`;
}
function snowFall(t,dens=1){let s='';for(let i=0;i<34;i++){const sp=18+(i%5)*6;const x=(i*131+Math.sin(t*0.8+i)*20+2000)%1080, y=((t*sp+i*53)%660)-30, r=2+(i%3);s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${0.75*dens}"/>`}return s}
function breathPuff(x,y,t,k){ if(k<=0)return ''; let s='';for(let i=0;i<3;i++){const p=((t*1.4+i*0.33)%1);s+=`<circle cx="${x+p*40+i*4}" cy="${y-p*26}" r="${6+p*14}" fill="#fff" opacity="${(1-p)*0.7*k}"/>`}return s}
function bareTree(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0,0 L0,-150 M0,-70 L-40,-120 M0,-95 L38,-140 M0,-120 L-22,-165 M-40,-120 L-55,-150 M38,-140 L52,-170" stroke="#5B4636" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M-46,-124 l-12,-4 M44,-146 l12,-6" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>`}
function pineTree(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-8" y="-30" width="16" height="30" fill="#5B4636"/><path d="M0,-170 L46,-90 L28,-90 L58,-30 L-58,-30 L-28,-90 L-46,-90Z" fill="#3E7A5A" stroke="#2C5A42" stroke-width="4"/><path d="M0,-170 L20,-135 L-20,-135Z M-30,-92 L-10,-100 L8,-92 L28,-96 L36,-88 L-38,-88Z" fill="#fff"/></g>`}
// pond geometry
let NOSIGN=false;
const POND={cx:660,cy:470,rx:360,ry:78};
const HOLE={x:600,y:478};
function pondScene(o){
  const t=T; let s='';
  s+=`<rect x="-600" y="-300" width="2300" height="700" fill="url(#winterSky)"/>`;
  s+=`<circle cx="860" cy="90" r="46" fill="#FFF6D8" opacity=".85"/>`;
  s+=`<path d="M-600,330 C-200,250 100,300 380,270 C620,245 900,290 1700,260 L1700,420 L-600,420Z" fill="#DCE8F2"/>`;
  s+=`<path d="M-600,360 C-100,320 300,350 600,330 C900,315 1200,345 1700,330 L1700,430 L-600,430Z" fill="#EAF2F8"/>`;
  [[-120,370,.9],[70,360,1.05],[930,355,1.0],[1110,368,.85],[1300,360,1]].forEach(([x,y,k])=>s+=pineTree(x,y,k));
  [[240,365,.8],[780,352,.75],[1020,372,.7]].forEach(([x,y,k])=>s+=bareTree(x,y,k));
  s+=`<rect x="-600" y="380" width="2300" height="400" fill="#F4F8FB"/>`;
  for(let i=0;i<14;i++) s+=`<ellipse cx="${-500+i*170}" cy="${590+(i%3)*8}" rx="70" ry="10" fill="#E2ECF4"/>`;
  // pond
  const P=POND;
  s+=`<ellipse cx="${P.cx}" cy="${P.cy}" rx="${P.rx+12}" ry="${P.ry+8}" fill="#E2ECF4"/>`;
  s+=`<ellipse cx="${P.cx}" cy="${P.cy}" rx="${P.rx}" ry="${P.ry}" fill="url(#ice)" stroke="#9CC6DC" stroke-width="5"/>`;
  s+=`<path d="M${P.cx-240},${P.cy-30} L${P.cx-150},${P.cy-44} M${P.cx+60},${P.cy+28} L${P.cx+190},${P.cy+12} M${P.cx-60},${P.cy+40} L${P.cx-10},${P.cy+34}" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>`;
  if(o.sparkle){const k=o.sparkle;[[520,440],[760,452],[880,486]].forEach(([x,y],i)=>{const p=0.5+0.5*Math.sin(t*6+i*2);s+=`<g transform="translate(${x},${y}) scale(${k*p})"><path d="M0,-18 L4,-4 L18,0 L4,4 L0,18 L-4,4 L-18,0 L-4,-4Z" fill="#fff"/></g>`})}
  // warning sign on shore
  if(!o.noSign&&!NOSIGN) s+=`<g transform="translate(150,420)"><rect x="-5" y="0" width="10" height="70" fill="#7A5638" stroke="${OL}" stroke-width="3"/><path d="M0,-50 L42,20 L-42,20Z" fill="#F6C945" stroke="${OL}" stroke-width="4" stroke-linejoin="round"/><text x="0" y="12" text-anchor="middle" font-size="40" font-weight="800" fill="${OL}">!</text></g>`;
  // cracks
  if(o.crack>0){const c=o.crack, H=o.hole||HOLE;
    const rays=[[-120,-14],[-60,-30],[30,-26],[110,-8],[90,20],[-90,18],[0,28]];
    rays.forEach(([dx,dy],i)=>{const k=clamp(c*1.4-i*0.08);if(k<=0)return; s+=`<path d="M${H.x},${H.y} l${dx*0.35*k},${dy*0.35*k+4} l${dx*0.35*k},${dy*0.35*k-6} l${dx*0.3*k},${dy*0.3*k+3}" fill="none" stroke="#3D6E8C" stroke-width="${3+2*k}" stroke-linecap="round" stroke-linejoin="round"/>`});
  }
  if(o.hole){const H=o.hole, w=o.holeW||1;
    s+=`<ellipse cx="${H.x}" cy="${H.y}" rx="${90*w}" ry="${26*w}" fill="#2B5671" stroke="#E8F4FA" stroke-width="7"/>`;
    s+=`<ellipse cx="${H.x}" cy="${H.y+4}" rx="${70*w}" ry="${16*w}" fill="#1F4258"/>`;
  }
  if(o.chunk!=null){const k=o.chunk;const H=o.hole||HOLE; s+=`<g transform="translate(${H.x-96+k*10},${H.y-2+k*14}) rotate(${-k*30})"><path d="M-30,-8 L24,-12 L30,6 L-26,10Z" fill="#CFE9F5" stroke="#8DB8CF" stroke-width="4"/></g>`}
  return s;
}
function heroInWater(o){ // x,y = water surface centre
  const t=T, st=KID, s=o.s||0.7, sh=o.shiver?Math.sin(t*38)*2.5*o.shiver:0, sink=o.sink||0;
  let v='';
  const aL=o.armL||[-130,-20], aR=o.armR||[130,20];
  const back=arm(-40,-52+sink*30,aL[0],aL[1],st.top,st.skin,50,46,24,'');
  const front=arm(40,-52+sink*30,aR[0],aR[1],st.top,st.skin,50,46,24,'');
  v+=`<rect x="-46" y="${-70+sink*30}" width="92" height="${74-sink*30}" rx="26" fill="${st.top}" stroke="${OL}" stroke-width="4.5"/>`;
  v+=`<path d="M-50,${-62+sink*30} Q0,${-44+sink*30} 50,${-62+sink*30}" stroke="${st.scarf}" stroke-width="16" fill="none" stroke-linecap="round"/>`;
  v+=g(`translate(${sh},${110+sink*30}) rotate(${o.tilt||0},0,-180)`,head(o,st));
  v+=back.svg+front.svg;
  // front water lip
  v+=`<path d="M-92,0 Q0,30 92,0 L92,6 Q0,40 -92,6Z" fill="#2B5671"/>`;
  // ripples
  for(let i=0;i<2;i++){const p=((t*0.9+i*0.5)%1);v+=`<ellipse cx="0" cy="4" rx="${60+p*50}" ry="${12+p*8}" fill="none" stroke="#9FD3F0" stroke-width="3" opacity="${(1-p)*0.8}"/>`}
  if(o.splash>0){for(let i=0;i<10;i++){const a=-Math.PI*(0.1+0.8*((i*0.37)%1)), p=((t*2.2+i*0.13)%1);v+=`<circle cx="${Math.cos(a)*(30+p*90)}" cy="${-Math.abs(Math.sin(a))*(10+p*80)+p*p*60}" r="${7-p*4}" fill="#CFEFFF" stroke="#5C9AC0" stroke-width="2" opacity="${o.splash*(1-p)}"/>`}}
  v+=breathPuff(20,-150+sink*30,t,o.breath||0);
  return g(`translate(${o.x},${o.y}) scale(${s})`,v);
}
function lyingHero(o){ // body flat on the ice, head to the left; x,y = feet
  const t=T; const ph=(o.ph||0)*Math.PI*2;
  const p=person({x:0,y:0,s:1,face:o.face||'neutral',armL:[mix(-150,-170,0.5+0.5*Math.sin(ph)),-10],armR:[mix(-150,-170,0.5+0.5*Math.sin(ph+Math.PI)),-10],seed:5,blink:blinkAt(t,4),lookX:-4},KID);
  return g(`translate(${o.x},${o.y}) scale(${o.s||0.7}) rotate(-90)`,p);
}

// ---------- characters ----------
const KID={skin:'#E8B48A',hair:'#6B3E26',top:'#3E6FC0',pants:'#2D3550',shoe:'#F4F1EC',hairStyle:'curly',hat:'#D8433C',hatBand:'#B8302A',scarf:'#F6C945'};
const MOM={skin:'#F0C29C',hair:'#A0452E',top:'#5DA26E',pants:'#4A3B5C',shoe:'#7A4A3A',hairStyle:'bun'};
const FRIEND={skin:'#C98D63',hair:'#2B1D18',top:'#8E5BC2',pants:'#2D3550',shoe:'#F4F1EC',hairStyle:'long',hat:'#F6C945',hatBand:'#E0AE2A',scarf:'#4FB0A5'};
function face(o,st){
  const lx=o.lookX||0, ly=o.lookY||0, f=o.face||'neutral', blink=o.blink||0;
  let s='';
  // eyes
  const eye=(ex,wide,wink)=>{
    if(blink||wink) return `<path d="M${ex-11},-238 Q${ex},-232 ${ex+11},-238" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
    if(f==='happy') return `<path d="M${ex-12},-236 Q${ex},-250 ${ex+12},-236" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>`;
    if(f==='bored') return `<circle cx="${ex}" cy="-238" r="11" fill="#fff" stroke="${OL}" stroke-width="3.5"/><circle cx="${ex+lx}" cy="${-235+ly}" r="5.5" fill="${OL}"/><path d="M${ex-13},-240 L${ex+13},-240 L${ex+13},-252 L${ex-13},-252Z" fill="${st.skin}"/><path d="M${ex-12},-240 L${ex+12},-240" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
    const r=wide?15:11.5, pr=wide?4.5:6;
    return `<circle cx="${ex}" cy="-238" r="${r}" fill="#fff" stroke="${OL}" stroke-width="3.5"/><circle cx="${ex+lx}" cy="${-238+ly}" r="${pr}" fill="${OL}"/><circle cx="${ex+lx+2}" cy="${-240+ly}" r="1.6" fill="#fff"/>`;
  };
  const wide=['panic','scared','shock','yell','spark'].includes(f);
  s+=eye(-23,wide,o.winkL)+eye(23,wide,false);
  // brows
  const bt={neutral:[0,0],happy:[-3,0],grin:[-4,0],panic:[-10,14],scared:[-8,12],shock:[-12,4],yell:[-2,-12],sheepish:[-6,10],bored:[2,-4],spark:[-10,0],proud:[-6,-4],suspicious:[0,-10]}[f]||[0,0];
  s+=`<path d="M-34,${-258+bt[0]} L-13,${-258+bt[0]-bt[1]*0.35}" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>
      <path d="M34,${-258+bt[0]} L13,${-258+bt[0]-bt[1]*0.35}" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  if(f==='suspicious') s=s.replace(/M34,(-?[\d.]+) L13/,'M34,-252 L13');
  // blush
  s+=`<ellipse cx="-40" cy="-214" rx="11" ry="6" fill="#F08A8A" opacity=".45"/><ellipse cx="40" cy="-214" rx="11" ry="6" fill="#F08A8A" opacity=".45"/>`;
  // mouth
  const m=o.mouth||0;
  if(m>0.06) s+=`<ellipse cx="0" cy="-204" rx="${8+m*6}" ry="${3+m*11}" fill="#7A2E2E" stroke="${OL}" stroke-width="3.5"/>`;
  else if(f==='grin'||f==='spark') s+=`<path d="M-17,-210 Q0,-188 17,-210 Z" fill="#7A2E2E" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/>`;
  else if(f==='panic'||f==='scared'||f==='shock') s+=`<ellipse cx="0" cy="-203" rx="7" ry="9" fill="#7A2E2E" stroke="${OL}" stroke-width="3.5"/>`;
  else if(f==='sheepish') s+=`<path d="M-14,-205 Q-7,-200 0,-205 Q7,-210 14,-205" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  else if(f==='bored'||f==='suspicious') s+=`<path d="M-11,-204 L11,-204" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  else s+=`<path d="M-13,-208 Q0,-196 13,-208" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  if(o.sweat) s+=`<path d="M48,-262 C53,-252 55,-246 48,-242 C41,-246 43,-252 48,-262Z" fill="#9FD6F5" stroke="${OL}" stroke-width="2.5"/>`;
  return s;
}
function head(o,st){
  let s='';const hs=st.hairStyle;
  if(hs==='bun') s+=`<circle cx="0" cy="-312" r="26" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`;
  if(hs==='bun'||hs==='long') s+=`<path d="M-66,-236 C-72,-170 -60,-150 -40,-150 L40,-150 C60,-150 72,-170 66,-236Z" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`;
  s+=`<circle cx="-64" cy="-232" r="11" fill="${st.skin}" stroke="${OL}" stroke-width="4"/><circle cx="64" cy="-232" r="11" fill="${st.skin}" stroke="${OL}" stroke-width="4"/>`;
  s+=`<ellipse cx="0" cy="-236" rx="64" ry="62" fill="${st.skin}" stroke="${OL}" stroke-width="4.5"/>`;
  if(hs==='curly'){let c='';for(let i=0;i<9;i++){const a=Math.PI*(1.05+i*0.11);c+=`<circle cx="${Math.cos(a)*54}" cy="${-246+Math.sin(a)*50}" r="${21+(i%2)*3}" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`}
    s+=c+`<path d="M-58,-262 C-50,-300 50,-300 58,-262 C40,-276 10,-268 0,-262 C-14,-276 -40,-276 -58,-262Z" fill="${st.hair}"/><path d="M-12,-292 q10,-8 22,-2" stroke="#8C5A3C" stroke-width="5" fill="none" stroke-linecap="round"/>`}
  if(hs==='bun'||hs==='long') s+=`<path d="M-64,-246 C-60,-300 60,-300 64,-246 C40,-268 -10,-272 -64,-246Z" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`;
  if(st.hat) s+=`<path d="M-64,-266 C-64,-336 64,-336 64,-266Z" fill="${st.hat}" stroke="${OL}" stroke-width="4"/><rect x="-68" y="-284" width="136" height="24" rx="11" fill="${st.hatBand}" stroke="${OL}" stroke-width="4"/><circle cx="0" cy="-334" r="15" fill="#fff" stroke="${OL}" stroke-width="4"/>`;
  return s+face(o,st);
}
function person(o,st){ // standing rig, origin feet
  const t=T, s=o.s||1, bob=Math.sin(t*2.2+(o.seed||0))*2.2;
  const wk=o.walk!=null? o.walk:null;
  let legs='';
  const legX=[-18,18];
  legX.forEach((lx,i)=>{const sw=wk!=null? Math.sin(wk*Math.PI*2+i*Math.PI)*16:0; const lift=wk!=null? Math.max(0,Math.sin(wk*Math.PI*2+i*Math.PI))*8:0;
    legs+=`<path d="M${lx},-66 L${lx+sw},${-6-lift}" stroke="${OL}" stroke-width="32" stroke-linecap="round"/><path d="M${lx},-66 L${lx+sw},${-6-lift}" stroke="${st.pants}" stroke-width="24" stroke-linecap="round"/><ellipse cx="${lx+sw+4}" cy="${-4-lift}" rx="19" ry="10" fill="${st.shoe}" stroke="${OL}" stroke-width="4"/>`});
  const lean=o.lean||0, slump=o.slump||0, sh=o.shake?Math.sin(t*40)*3*o.shake:0;
  const aL=o.armL||[12,10], aR=o.armR||[-12,-10];
  const rA=arm(-44,-158+slump*6,aL[0],aL[1],st.top,st.skin,50,46,24,o.handL||'');
  const rB=arm(44,-158+slump*6,aR[0],aR[1],st.top,st.skin,50,46,24,'');
  let body=`<rect x="-48" y="${-176+slump*5}" width="96" height="116" rx="30" fill="${st.top}" stroke="${OL}" stroke-width="4.5"/>
    <path d="M-16,${-174+slump*5} L0,${-156+slump*5} L16,${-174+slump*5}" fill="none" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/>`;
  if(st.scarf) body+=`<path d="M-42,${-170+slump*5} Q0,${-150+slump*5} 42,${-170+slump*5}" stroke="${OL}" stroke-width="24" fill="none" stroke-linecap="round"/><path d="M-42,${-170+slump*5} Q0,${-150+slump*5} 42,${-170+slump*5}" stroke="${st.scarf}" stroke-width="16" fill="none" stroke-linecap="round"/><rect x="14" y="${-160+slump*5}" width="16" height="44" rx="5" fill="${st.scarf}" stroke="${OL}" stroke-width="3.5"/>`;
  if(st===MOM) body+=`<path d="M0,-156 L0,-62" stroke="${OL}" stroke-width="3" opacity=".5"/>`;
  const behind=o.armLBehind?rA.svg:'';
  const front=(o.armLBehind?'':rA.svg)+rB.svg;
  const hold=o.holdR?o.holdR(rB.hx,rB.hy):'';
  const holdL=o.holdL?o.holdL(rA.hx,rA.hy):'';
  const hd=g(`translate(0,${slump*8}) rotate(${(o.tilt||0)})`,head(o,st));
  const inner=behind+legs+body+hd+front+hold+holdL;
  return g(`translate(${o.x+sh},${o.y}) scale(${(o.flip?-1:1)*s},${s}) rotate(${lean}) translate(0,${bob})`,inner);
}
function mrFine(o){ // traced from Episode 1 end card (coords: feet at 215,692)
  const t=T, S=(o.s||0.9)*0.34, bob=0;
  const m=o.mouth||0, emo=o.emo||'neutral';
  const OL='#141218', BONE='#F3EBDC', HOOD='#3B3448', HEM='#28232F', PINK='#E48AA5', PINKD='#C96E8C';
  const W=14;
  const aL=o.armL||[-11,0], aR=o.armR||[11,0];
  const armF=(sx,a)=>{const r=Math.PI/180;const sy=420;const ex=sx+Math.sin(a[0]*r)*74,ey=sy+Math.cos(a[0]*r)*74,hx=ex+Math.sin((a[0]+a[1])*r)*84,hy=ey+Math.cos((a[0]+a[1])*r)*84;const p=`M${sx},${sy} L${ex},${ey} L${hx},${hy}`;
    return {s:`<path d="${p}" fill="none" stroke="${OL}" stroke-width="${52+W*2}" stroke-linecap="round" stroke-linejoin="round"/><path d="${p}" fill="none" stroke="${HOOD}" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>`,hx,hy}};
  const L_=armF(108,aL), R_=armF(330,aR);
  const hand=(h,kind,side)=>{
