    for(let u=n2a;u<=t;u+=0.05){ const pu=integ(vBad,u); let r=0,y=395,xx=pu+580;
      r=mix(0,14,A(u,n2a,n2b)); y=mix(395,410,A(u,n2a,n2b)); if(u>=n2b){const k=A(u,n2b,FZ+0.3); r=14+230*Math.pow(k,1.2); y=mix(410,480,k); xx=pu+mix(580,640,k);}
      const rr=r*Math.PI/180, c=Math.cos(rr), sn=Math.sin(rr);

  if(kind==='gas') s=`<rect x="-16" y="-34" width="32" height="60" rx="6" fill="#9A97A0" stroke="#fff" stroke-width="4"/><path d="M28,10 L28,-24 M18,-14 L28,-26 L38,-14" stroke="#F6C945" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

}

function stampCheck(x,y,sc){ if(sc<=0) return ''; return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="40" fill="#3FB27F" stroke="#fff" stroke-width="6"/><path d="M-18,0 L-5,14 L20,-14" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}


function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) rotate(${sc.rot||0}) translate(${-c.x},${-c.y})`;

  const tilt=sc.gray? -0.6:0;

  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;

      <text x="540" y="618" text-anchor="middle" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1">AND YOU SLAM THE BRAKES?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
