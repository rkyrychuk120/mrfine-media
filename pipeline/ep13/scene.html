      return `<g transform="translate(${x},100) scale(${k})"><rect x="-105" y="-72" width="210" height="144" rx="18" fill="#E5383B" stroke="#fff" stroke-width="5"/><g transform="translate(0,-20)">${tipIcon(ic,0.9)}</g><text y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">${txt}</text></g>`; };
    over+=card(460,sr,'drain','SEA RUNS AWAY')+card(690,ro,'roar','LOUD ROAR')+card(920,eq,'quake','EARTHQUAKE');
    const rows=[[hg,t<inl?'GO TO HIGH GROUND':'HIGH GROUND OR FAR INLAND','#3FB27F','hill'],[hr,'STAY THERE FOR HOURS','#F6C945','clock'],[fw,'FIRST WAVE IS NOT THE BIGGEST','#fff','waves']];
    rows.forEach(([ts,txt,bg,ic],i)=>{ if(t<ts) return; const sc=popS(t,ts); const y=290+i*100;
      over+=`<g transform="translate(0,${y})"><g transform="translate(395,0)">${tipIcon(ic,sc*0.75)}</g>${badge(710,0,txt,{sc,fs:txt.length>24?25:28,bg,fg:bg==='#3FB27F'?'#fff':'#2a2018'})}</g>`});
    cam={s:0.5,x:340,y:300};
  }
  else { // ===== end card
    const e0=M4.start-0.2;
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="url(#cardbg)"/>`;
    panel+=`<g opacity="${A(t,e0,e0+0.3)}"><text x="740" y="230" text-anchor="middle" font-size="98" font-weight="800" fill="#1C1A20" letter-spacing="-2">MR FINE</text>
      <text x="740" y="305" text-anchor="middle" font-size="46" font-weight="700" fill="#1f1b24" opacity="${A(t,e0+0.3,e0+0.6)}">The video can wait.</text>
      <g transform="translate(740,395) scale(${popS(t,P_('m4.1'))})"><text x="0" y="0" text-anchor="middle" font-size="60" font-weight="800" fill="#E86A90">YOUR LIFE CAN'T.</text></g></g>`;
    const m=fineMouth();
    fine={x:300,y:548,s:1.4,mouth:m,armR:t<P_('m4.1')?[150+Math.sin(t*14)*12,10]:[30,150],handR:t<P_('m4.1')?'':'thumb',wink:t>M4.start+M4.dur+0.4,emo:'neutral',smile:t>M4.start+M4.dur+0.3};
    cam={s:1.0,x:540,y:304};
    return {panel,cam,gray,over:mrFine(fine)+over,raw:true,shake,rot};
  }
  over=under+(fine?mrFine(fine):'')+over;
  return {panel,cam,gray,over,raw,shake,rot};
}
function tipIcon(kind,sc){ if(sc<=0) return ''; let s='';
  if(kind==='hill') s=`<path d="M-34,24 Q-10,-30 0,-30 Q10,-30 34,24Z" fill="#3FB27F" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M0,-30 L0,-50 L18,-43 L0,-36" fill="#fff" stroke="#fff" stroke-width="3"/>`;
  if(kind==='clock') s=`<circle r="28" fill="none" stroke="#fff" stroke-width="7"/><path d="M0,-16 L0,0 L12,8" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(kind==='waves') s=`<path d="M-34,10 q8,-16 17,0 q8,16 17,0 q8,-16 17,0 q8,16 17,0" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-20,-12 q6,-12 12,0 q6,12 12,0 q6,-12 12,0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>`;
  if(kind==='drain') s=`<rect x="-40" y="4" width="80" height="20" fill="#EED9A4"/><rect x="${6+Math.sin(T*3)*6}" y="4" width="40" height="20" fill="#3E9BCB"/><path d="M-20,-14 L24,-14 M14,-24 L26,-14 L14,-4" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(kind==='roar') s=`<path d="M-30,-10 L-14,-10 L4,-26 L4,26 L-14,10 L-30,10Z" fill="#fff"/><path d="M14,-14 q12,14 0,28 M24,-24 q22,24 0,48" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(kind==='quake') s=`<path d="M-40,0 L-26,0 L-18,-22 L-8,22 L2,-26 L12,20 L20,-10 L26,0 L40,0" stroke="#fff" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  return `<g transform="scale(${sc})">${s}</g>`;
}

function stampCheck(x,y,sc){ if(sc<=0) return ''; return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="40" fill="#3FB27F" stroke="#fff" stroke-width="6"/><path d="M-18,0 L-5,14 L20,-14" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}


function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) rotate(${sc.rot||0}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;
  // banner
  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>
      <text x="540" y="548" text-anchor="middle" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1">WHAT IF THE SEA</text>
      <text x="540" y="618" text-anchor="middle" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1">SUDDENLY DISAPPEARS?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
</script></body></html>
