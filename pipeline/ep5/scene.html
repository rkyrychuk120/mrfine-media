  } else if(t<E.n3c){ // side view, asleep, car drifting
    const inside=()=>{ const o=heroO({x:60,y:-104,s:0.62,face:'neutral',blink:1,mouth:0,tilt:22,slump:1,armR:[40,30],armL:[95,4],armLBehind:true});
      return steering(165,-226,8+A(t,E.n3a,E.n3c)*30)+seated(60,o,HERO)+[0,1,2].map(i=>cup(-150+i*36,-208,0.55)).join('')+zzz(80,-300,1);};
    panel+=driveScene(t,{inside,drift:1});
    cam={s:mix(1.5,1.8,A(t,E.n3a,E.n3c)),x:mix(600,620,A(t,E.n3a,E.n3c)),y:mix(390,370,A(t,E.n3a,E.n3c))};
    const sec=t<E.n3b?1:2;
    over+=badge(560,52,`EYES CLOSED 0:0${sec}`,{sc:popS(t,sec===1?E.n3a:E.n3b),bg:'#E5383B',fg:'#fff',fs:34});
  } else { // POV slit, oncoming lights, snap open
    const open=A(t,E.snap,E.snap+0.18);

    over+=badge(560,52,`EYES CLOSED 0:03`,{sc:popS(t,E.n3c),bg:'#E5383B',fg:'#fff',fs:34});

    return {panel,over,cam,raw:true,shake:t>=E.snap?(1-A(t,E.snap,E.snap+0.6))*10:0};
  }
  return {panel,over,cam};
}
function brainGag(x,y,sc,k){ if(sc<=0) return ''; const t=T, w=Math.sin(t*5)*8*k;
  const spiral=(cx)=>`<g transform="translate(${cx},10) rotate(${t*400})"><path d="M0,0 m-2,0 a2,2 0 1 1 4,0 a5,5 0 1 1 -10,0 a8,8 0 1 1 16,0 a11,11 0 1 1 -22,0" fill="none" stroke="${OL}" stroke-width="4"/></g>`;
  let s=`<g transform="translate(${x},${y}) scale(${sc}) rotate(${w})"><path d="M-110,20 C-140,10 -136,-46 -100,-54 C-104,-96 -50,-110 -28,-82 C-10,-112 40,-108 46,-74 C86,-90 112,-44 90,-16 C122,6 104,60 64,54 C54,88 4,88 -6,62 C-32,88 -86,76 -82,44 C-112,48 -126,30 -110,20Z" fill="#EE93AE" stroke="#C76487" stroke-width="8"/><path d="M0,-76 C-14,-26 14,12 0,58 M-72,-18 C-46,-10 -42,14 -60,26 M68,-26 C42,-14 42,10 64,22" stroke="#C76487" stroke-width="7" fill="none" stroke-linecap="round"/>`;

  s+=`</g>`;

function bedIcon(){return `<rect x="-60" y="-6" width="120" height="30" rx="8" fill="#7FB8D8" stroke="${OL}" stroke-width="4"/><rect x="-56" y="-22" width="36" height="18" rx="8" fill="#fff" stroke="${OL}" stroke-width="4"/><path d="M-60,24 L-60,36 M60,24 L60,36" stroke="${OL}" stroke-width="6"/><text x="16" y="-14" font-size="28" font-weight="800" fill="#2a2018">Zz</text>`}
function scene(t){
  let panel='', cam={s:1,x:540,y:304}, gray=false, over='', fine=null, raw=false, shake=0;
  const M1=CLIP('m1'), N4=CLIP('n4'), H2=CLIP('h2'), M2=CLIP('m2'), M3=CLIP('m3'), M4=CLIP('m4');
  const pauseAt=M1.start-0.15, rwEnd=N4.start-0.05, rwStart=rwEnd-1.1;
  const FZ=PE('n3.2')+0.35;
  if(t<pauseAt){ const b=badPath(t); panel=b.panel; over=b.over; cam=b.cam; raw=b.raw; shake=b.shake||0; }
  else if(t<rwStart){ // ===== Mr Fine pause
    gray=true; const keep=T; T=FZ; const b=badPath(FZ); T=keep; panel=b.panel; raw=true;
    over+=`<g opacity="${A(t,pauseAt,pauseAt+0.2)}"><rect x="34" y="34" width="14" height="46" fill="#fff"/><rect x="58" y="34" width="14" height="46" fill="#fff"/><text x="88" y="70" font-size="30" font-weight="800" fill="#fff">PAUSED</text></g>`;
    const d1=P_('m1.1'), d2=P_('m1.2'), rw=P_('m1.3');
    if(t>=d1&&t<rw) over+=`<rect x="400" y="0" width="680" height="608" fill="#141218" opacity="${0.6*A(t,d1,d1+0.3)}"/>`;
    if(t>=d1&&t<d2){ over+=badge(740,70,'24 HOURS AWAKE',{sc:popS(t,d1+0.1),fs:32,bg:'#fff'})+brainGag(740,300,popS(t,d1+0.4,0.4)*1.1,A(t,d1+0.4,d1+1.4)) + (t>=d1+1.8?badge(740,530,'= LIKE A FEW DRINKS',{sc:popS(t,d1+1.8),fs:30,bg:'#F6C945'}):''); }
    if(t>=d2&&t<rw){ const k=popS(t,d2,0.3); over+=badge(740,70,'IT CAN SLEEP',{sc:k,fs:32,bg:'#E5383B',fg:'#fff'});
      const cnt=Math.min(3,1+Math.floor((t-d2-0.4)/0.7));
      over+=`<g transform="translate(740,300) scale(${k*1.6})">${icon5('eye',1)}</g>`+(t>=d2+0.4?`<text x="740" y="440" text-anchor="middle" font-size="64" font-weight="800" fill="#fff">${'1… 2… 3…'.slice(0,[0,2,5,8][cnt])}</text>`:'')+(t>=d2+2.2?badge(740,530,'WITHOUT ASKING YOU',{sc:popS(t,d2+2.2),fs:30,bg:'#F6C945'}):'');}
    const wi=A(t,pauseAt,pauseAt+0.9), fx=mix(-120,150,wi);
    let o={x:fx,y:575,s:0.86,mouth:fineMouth(),walk:t<pauseAt+0.9?(t*2)%1:null,armL:[-8,2],armR:[40,60],handR:'remote',
      emo:t<d1?'neutral':t<d2?'serious':t<rw?'worried':'happy'};
    if(t>=d1+0.3&&t<d1+1.6){o.armL=[-110,10];o.handL='point'}
    if(t>=rw){o.armR=[70,50];o.press=t>rw+0.2&&t<rw+0.6}
    fine=o;
  }
  else if(t<rwEnd){ // ===== rewind
    const k=L(t,rwStart,rwEnd); const back=mix(FZ,0.4,Math.pow(k,0.8));
    const keep=T; T=back; const b=badPath(back); T=keep;
    panel=b.panel; cam=b.cam; raw=b.raw; gray=k<0.4;
    over+=`<g><path d="M40,40 L60,58 L40,76Z M64,40 L84,58 L64,76Z" fill="#fff" transform="rotate(180,62,58)"/><text x="100" y="70" font-size="30" font-weight="800" fill="#fff">REWIND</text></g>`;
    for(let i=0;i<5;i++){const yy=(i*137+t*900)%608;over+=`<rect x="0" y="${yy}" width="1080" height="${6+i%3*4}" fill="#fff" opacity=".18"/>`}
    fine={x:150,y:575,s:0.86,armR:[70,50],handR:'remote',remoteAng:70,press:true,mouth:0,emo:'happy'};
  }
  else if(t<H2.start){ // ===== right move: parked car, keys away, taxi
    const a0=P_('n4.0'), a1=P_('n4.1'), a2=P_('n4.2'), a3=P_('n4.3'), a4=P_('n4.4');
    panel+=nightBG(0);
    panel+=car(560,548,0.78,{});
    // taxi arrives from right at a3, stops at x=1320
    const tx=t<a3?2200:mix(2000,1330,A(t,a3,a3+1.2));
    if(t>=a3) panel+=car(tx,560,0.78,{col:'#F2C230',dk:'#C99A1E',sign:true,checker:true,wheelAng:-tx*1.2,beam:1,inside:()=>seated(60,heroO({x:60,y:-104,s:0.62,face:'happy',blink:blinkAt(T,3),mouth:0,armR:[95,4],armL:[95,4],armLBehind:true}),DRIVER)+steering(165,-226,8)});
    let o=heroO({x:930,face:'bored',blink:blinkAt(T,1)});

    else { o.armR=[12,-30]; o.face=t>=a3?'happy':'neutral'; o.lookX=t>=a3?5:0; }
    if(t>=a4+0.2){ o.walk=((t-a4)*1.6)%1; o.x=mix(930,1150,A(t,a4+0.2,H2.start)); o.armL=[150,-10]; }
    panel+=person(o,HERO);
    if(t>=a4) panel+=bubble(o.x-130,300,190,96,`<g transform="translate(0,4) scale(.8)">${bedIcon()}</g>`,popS(t,a4));
    fine={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<a2?'neutral':'happy',armR:t>=a3+0.3?[30,150]:[11,0],handR:t>=a3+0.5?'thumb':'',nod:t>a3&&t<a3+0.8};
    if(t>=a2&&t<a3) over+=badge(700,60,"TIRED? DON'T DRIVE",{sc:popS(t,a2),fs:30,bg:'#F6C945'})+stampX(460,340,70,popS(t,a2+0.3));
    if(t>=a3&&t<a4) over+=badge(700,60,'TAKE A TAXI',{sc:popS(t,a3),fs:30,bg:'#F6C945'});
    if(t>=a4) over+=badge(700,60,'OR SLEEP FIRST',{sc:popS(t,a4),fs:30,bg:'#fff'})+stampCheck(940,150,popS(t,a4+0.6));
    const cx=t<a3?mix(700,740,A(t,N4.start,a3)):mix(740,1010,A(t,a3,a3+1.4));

  }

    panel+=driveScene(t,{inside,col:'#F2C230',dk:'#C99A1E',sign:true,checker:true});
    fine={x:150,y:575,s:0.86,mouth:0,emo:'neutral',smile:true};
    cam={s:mix(1.6,1.75,A(t,H2.start,M2.start)),x:mix(560,540,A(t,H2.start,M2.start)),y:380};
    over+=badge(700,60,'SAFE. ASLEEP. HOME SOON.',{sc:popS(t,H2.start+0.2),fs:26,bg:'#fff'});
  }
  else if(t<M3.start){ // ===== punchline: dizzy brain
    panel+=nightBG(T*60);
    panel+=`<rect x="-900" y="-400" width="2900" height="1100" fill="#1b1622" opacity=".35"/>`;
    const p1=P_('m2.1');
    let o={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<p1?'serious':'happy'};
    if(t<p1-0.2){o.armL=[-110,10];o.handL='point'}
    if(t>=p1){o.wink=t>PE('m2.1')-0.5&&t<PE('m2.1')+0.2;o.armR=[30,150];o.handR='thumb'}
    fine=o;
    over+=badge(720,60,'DRINKS: 0',{sc:popS(t,M2.start+0.1),fs:32,bg:'#fff'});
    over+=brainGag(720,320,popS(t,M2.start+0.3,0.4)*1.2,1);

    const q=P_('m3.0'), a=P_('m3.1'), b=P_('m3.2'), c=P_('m3.3');

    fine=o;
    const rows=[[q-0.1,'HEAVY EYES?','#fff','eye'],[q+0.8,'YAWNING?','#fff','yawn'],[a,'PULL OVER SAFELY','#F6C945','park'],[b,'SLEEP','#F6C945','sleep'],[c,'COFFEE IS NOT SLEEP','#E5383B','coffeex']];

      <text x="740" y="305" text-anchor="middle" font-size="50" font-weight="700" fill="#1f1b24" opacity="${A(t,e0+0.3,e0+0.6)}">Home can wait.</text>

function stampCheck(x,y,sc){ if(sc<=0) return ''; return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="40" fill="#3FB27F" stroke="#fff" stroke-width="6"/><path d="M-18,0 L-5,14 L20,-14" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}


function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;

  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>

      <text x="540" y="620" text-anchor="middle" font-size="54" font-weight="800" fill="#fff" letter-spacing="-1">STAY AWAKE 24 HOURS?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
