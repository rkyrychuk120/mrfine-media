    if(t>=rw){o.armR=[70,50];o.press=t>rw+0.2&&t<rw+0.6}
    fine=o;
  }
  else if(t<rwEnd){ // ===== rewind
    const k=L(t,rwStart,rwEnd); const back=mix(FZ,0.3,Math.pow(k,0.8));
    const keep=T; T=back; const b=badPath(back); T=keep;
    panel=b.panel; cam=b.cam; rot=b.rot; gray=k<0.4;
    over+=`<g><path d="M40,40 L60,58 L40,76Z M64,40 L84,58 L64,76Z" fill="#fff" transform="rotate(180,62,58)"/><text x="100" y="70" font-size="30" font-weight="800" fill="#fff">REWIND</text></g>`;
    for(let i=0;i<5;i++){const yy=(i*137+t*900)%608;over+=`<rect x="0" y="${yy}" width="1080" height="${6+i%3*4}" fill="#fff" opacity=".18"/>`}
    fine={x:150,y:575,s:0.86,armR:[70,50],handR:'remote',remoteAng:70,press:true,mouth:0,emo:'neutral'};
  }
  else if(t<M2.start){ // ===== right move: no phone, seatbelt off, window open, out
    const a0=P_('n4.0'), a1=P_('n4.1'), a2=P_('n4.2'), a3=P_('n4.3'), a4=P_('n4.4');
    const a3b=a3+0.95; // "Window open."
    const hS=H2.start, hE=H2.start+H2.dur, call=P_('h2.1');
    panel+=lakeBG();
    const outT=a4, swimT=a4+0.55, landT=hS+1.0;
    const sink=mix(26,40,A(t,a0,outT))+mix(0,120,A(t,outT+0.3,M2.start+1));
    const cy=SURF+sink, crot=3+Math.sin(T*1.6)*1.2+mix(0,6,A(t,outT,M2.start));
    let co={x:540,y:cy,rot:crot,face:'neutral',lookX:4,belt:1-A(t,a3,a3+0.35),glass:1-A(t,a3b,a3b+0.5),heroIn:t<outT};
    if(t<a2) co.face='scared';
    panel+=bubbles(560,cy-40,T,t>outT?8:3,300,0.8);
    panel+=car(co);
    // hero: climbs out of the window, swims to the bank, stands up
    let ho=null, inWater=false;
    if(t>=outT && t<swimT){ const k=A(t,outT,swimT); ho=heroO({x:mix(560,640,k),y:mix(cy+10,SURF+80,k),s:0.75,face:'scared',mouth:0,armL:[-150,-10],armR:[150,10],lean:mix(-10,30,k)}); inWater=true; }
    else if(t>=swimT && t<landT){ const k=A(t,swimT,landT), st=(T*2.2)%1; ho=heroO({x:mix(640,790,k),y:SURF+80,s:0.75,face:'neutral',mouth:envOf('hero'),lean:70,armL:[-180+Math.sin(st*Math.PI*2)*90,-10],armR:[180-Math.sin(st*Math.PI*2)*90,10]}); inWater=true; }
    else if(t>=landT){ const k=A(t,landT,landT+0.5); ho=heroO({x:mix(830,900,k),y:mix(SURF+40,SURF-28,k),s:0.75,face:t<call?'happy':'neutral',mouth:envOf('hero'),walk:k<1?(t*2)%1:null});
      if(t>=call-0.4){ ho.armL=[-40,-100]; ho.holdL=(x,y)=>`<g transform="translate(${x},${y-14}) rotate(10)"><rect x="-11" y="-24" width="22" height="42" rx="5" fill="#26232B" stroke="${OL}" stroke-width="3.5"/><rect x="-7" y="-19" width="14" height="28" rx="2" fill="#7EC8F0"/></g>`; }
      else ho.armR=[150,20];
      ho.sweat=1; }
    if(ho&&inWater) panel+=person(ho,HERO);
    panel+=water(true)+shore();
    if(ho&&!inWater){ panel+=person(ho,HERO); for(let i=0;i<4;i++){const p=((T*1.3+i*0.25)%1); panel+=`<path d="M${ho.x-40+i*26},${ho.y-120+p*90} c3,6 4,9 0,12 c-4,-3 -3,-6 0,-12Z" fill="#9FD6F5" stroke="${OL}" stroke-width="2" opacity="${1-p}"/>`} }
    over+=timerBadge(mix(60,52,A(t,a0,M2.start)));
    if(t<a2) over+=badge(620,545,t<a1?'SAME LAKE':'SAME CAR',{sc:popS(t,t<a1?a0:a1),fs:30,bg:'#fff'});
    else if(t<a3) over+=badge(620,545,'PHONE',{sc:popS(t,a2),fs:34,bg:'#fff'})+stampX(620,545,46,popS(t,a2+0.5));
    const ic=[[a3,'SEATBELT OFF'],[a3b,'WINDOW OPEN'],[a4,'GET OUT']];
    ic.forEach(([ts,txt],i)=>{ if(t>=ts&&t<hS) over+=badge(690,90+i*70,txt,{sc:popS(t,ts),fs:28,bg:'#F6C945'})+stampCheck(520,90+i*70,popS(t,ts+0.15)*0.5)});
    if(t>=hS) over+=badge(690,90,t<call?'OUT IN TIME':'NOW CALL',{sc:popS(t,t<call?hS:call),fs:28,bg:t<call?'#3FB27F':'#fff',fg:t<call?'#fff':'#2a2018'});
    fine={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<a2?'serious':'neutral',armR:[11,0],nod:t>a3&&t<a3+0.8};
    if(t>=a3&&t<a4){fine.armL=[-110,10];fine.handL='point'}
    if(t>=hS){ fine.mouth=0; fine.emo='happy'; }
    cam={s:mix(1.0,1.08,A(t,a0,a4)),x:mix(540,600,A(t,a0,hS+1)),y:mix(300,290,A(t,a0,a4))};
  }
  else if(t<M3.start){ // ===== punchline: dry land, better signal
    panel+=lakeBG();
    const p0=M2.start, b2=P_('m2.1'), b3=P_('m2.2');
    panel+=bubbles(560,SURF+300,T,7,260,1)+car({x:540,y:SURF+190+A(t,p0,M3.start)*40,rot:9,heroIn:false,glass:0});
    panel+=water(true)+shore();
    let o=heroO({x:900,y:SURF-28,s:0.75,face:'happy',mouth:0,armR:[-14,-10],sweat:1});
    o.armL=[-40,-100]; o.holdL=(x,y)=>`<g transform="translate(${x},${y-14}) rotate(10)"><rect x="-11" y="-24" width="22" height="42" rx="5" fill="#26232B" stroke="${OL}" stroke-width="3.5"/><rect x="-7" y="-19" width="14" height="28" rx="2" fill="#7EC8F0"/></g>`;
    if(t>=b3){ o.face='grin'; }
    for(let i=0;i<3;i++){const p=((T*1.5+i/3)%1); panel+=`<path d="M${900-0.75*105-30-p*30},${SURF-28-0.75*175-14} a${14+p*20},${14+p*20} 0 0,0 0,${28+p*40}" transform="translate(0,${-p*20})" stroke="#fff" stroke-width="4" fill="none" opacity="${1-p}"/>`}
    panel+=person(o,HERO);
    for(let i=0;i<4;i++){const h=12+i*12, on=t>=b3+i*0.12; panel+=`<rect x="${960+i*16}" y="${SURF-200-h}" width="11" height="${h}" fill="${on?'#3FB27F':'#ffffff'}" stroke="${OL}" stroke-width="3" opacity="${A(t,b2,b2+0.3)}"/>`}
    let f={x:150,y:575,s:0.86,mouth:fineMouth(),emo:'neutral'};
    if(t>=b2&&t<b3){f.armL=[-110,10];f.handL='point'}
    if(t>=b3){f.armR=[30,150];f.handR='thumb';f.wink=t>b3+0.3&&t<b3+1.0;f.emo='happy'}
    fine=f;
    over+=badge(720,90,'MUM: GOT THE CALL',{sc:popS(t,p0+0.1),fs:28,bg:'#fff'});
    if(t>=b2) over+=badge(720,180,'FROM DRY LAND',{sc:popS(t,b2),fs:30,bg:'#F6C945',rot:-3});
    if(t>=b3) over+=badge(720,270,'SIGNAL: 4 BARS',{sc:popS(t,b3),fs:28,bg:'#3FB27F',fg:'#fff'});
    cam={s:1.0,x:560,y:300};
  }
  else if(t<M4.start){ // ===== survival tip
    panel+=lakeBG()+water(true)+shore();
    panel+=`<rect x="-900" y="-600" width="3200" height="2400" fill="#1b1622" opacity=".86"/>`;
    const q=P_('m3.0'), a=P_('m3.1'), b=P_('m3.2'), c=P_('m3.3'), d=P_('m3.4');
    let o={x:150,y:575,s:0.95,mouth:fineMouth(),emo:'serious'};
    if(t>=a&&t<M4.start-0.3){o.armR=[120,-10];o.handR='point'}
    fine=o;
    const rows=[[q-0.1,'CAR IN WATER?','#fff','car'],[a,'SEATBELT OFF','#F6C945','belt'],[b,'WINDOW OPEN','#F6C945','win'],[c,'GET OUT','#3FB27F','out'],[d,'THEN CALL FOR HELP','#fff','call']];
    rows.forEach(([ts,txt,bg,ic],i)=>{ if(t<ts) return; const sc=popS(t,ts); const y=70+i*112;
      over+=`<g transform="translate(0,${y})"><g transform="translate(440,0)">${tipIcon(ic,sc*0.8)}</g>${badge(770,0,txt,{sc,fs:32,bg,fg:(bg==='#3FB27F')?'#fff':'#2a2018'})}</g>`});
    cam={s:1.0,x:540,y:304};
  }
  else { // ===== end card
    const e0=M4.start-0.2;
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="url(#cardbg)"/>`;
    panel+=`<g opacity="${A(t,e0,e0+0.3)}"><text x="740" y="230" text-anchor="middle" font-size="98" font-weight="800" fill="#1C1A20" letter-spacing="-2">MR FINE</text>
      <text x="740" y="305" text-anchor="middle" font-size="46" font-weight="700" fill="#1f1b24" opacity="${A(t,e0+0.3,e0+0.6)}">Your call can wait.</text>
      <g transform="translate(740,395) scale(${popS(t,P_('m4.1'))})"><text x="0" y="0" text-anchor="middle" font-size="60" font-weight="800" fill="#E86A90">YOUR LIFE CAN'T.</text></g></g>`;
    const m=fineMouth();
    fine={x:300,y:548,s:1.4,mouth:m,armR:t<P_('m4.1')?[150+Math.sin(t*14)*12,10]:[30,150],handR:t<P_('m4.1')?'':'thumb',wink:t>M4.start+M4.dur+0.4,emo:'neutral',smile:t>M4.start+M4.dur+0.3};
    cam={s:1.0,x:540,y:304};
  }
  if(fine) over=mrFine(fine)+over;
  return {panel,cam,gray,over,raw,shake,rot};
}
function tipIcon(kind,sc){ if(sc<=0) return ''; let s='';
  if(kind==='car') s=`<g transform="scale(.26) translate(0,60)">${car({x:0,y:0,rot:8,heroIn:false})}</g><path d="M-60,4 Q-30,-6 0,4 T60,4" stroke="#7EC8F0" stroke-width="6" fill="none"/>`;
  if(kind==='belt') s=`<path d="M-24,-30 L24,30" stroke="#F6C945" stroke-width="12" stroke-linecap="round"/><rect x="-14" y="-8" width="28" height="18" rx="4" fill="#9A97A0" stroke="${OL}" stroke-width="3"/><path d="M14,-34 L34,-14" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`;
  if(kind==='win') s=`<rect x="-34" y="-28" width="68" height="52" rx="6" fill="none" stroke="#fff" stroke-width="5"/><rect x="-28" y="6" width="56" height="14" fill="#BFE6F7"/><path d="M0,-18 L0,0 M-10,-8 L0,2 L10,-8" stroke="#F6C945" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(kind==='out') s=`<path d="M-26,20 L22,-24 M2,-26 L24,-26 L24,-4" stroke="#3FB27F" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(kind==='call') s=`<rect x="-18" y="-32" width="36" height="62" rx="7" fill="#26232B" stroke="#fff" stroke-width="4"/><rect x="-12" y="-24" width="24" height="40" rx="3" fill="#7EC8F0"/>`;
  return `<g transform="scale(${sc})">${s}</g>`;
}

function stampCheck(x,y,sc){ if(sc<=0) return ''; return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="40" fill="#3FB27F" stroke="#fff" stroke-width="6"/><path d="M-18,0 L-5,14 L20,-14" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}


function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) rotate(${sc.rot||0}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;
  // banner
  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>
      <text x="540" y="548" text-anchor="middle" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">WHAT HAPPENS IF YOUR</text>
      <text x="540" y="618" text-anchor="middle" font-size="56" font-weight="800" fill="#fff" letter-spacing="-1">CAR GOES INTO A LAKE?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
</script></body></html>
