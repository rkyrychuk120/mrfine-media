  for(let i=-8;i<22;i++) s+=pine(i*120+((i*37)%50),360,0.55+((i*13)%5)*0.04,'#5E8566');
  s+=`<rect x="-900" y="420" width="3200" height="400" fill="#8DA86A"/>`;

  for(let i=-8;i<22;i++){const x=i*150+40; s+=`<ellipse cx="${x}" cy="${540+(i%3)*22}" rx="10" ry="4" fill="#97805A"/>`}
  for(let i=-6;i<16;i++) if(i%3!==1) s+=pine(i*230+70,465,0.95+((i*7)%4)*0.06,'#3F7148');

}

    if(t>=br&&t<M4.start-0.3){o.armR=[120,-10];o.handR='point'}
    fine=o;
    if(t<br+0.1) over+=badge(640,300,'REMEMBER',{sc:popS(t,q),fs:56,bg:'#F6C945',rot:-3});
    const card=(x,ts,flipAt,animal,txt,bg)=>{ if(t<ts) return ''; const k=popS(t,ts); const f=t<flipAt?1:Math.abs(Math.cos(Math.min(1,(t-flipAt)/0.3)*Math.PI)); const back=t>=flipAt+0.15;
      let c=`<rect x="-125" y="-75" width="250" height="150" rx="18" fill="${back?bg:'#fff'}" stroke="#fff" stroke-width="5"/>`;
      c+=back?`<text y="14" text-anchor="middle" font-size="${txt.length>8?32:40}" font-weight="800" fill="#fff">${txt}</text>`:`<g transform="translate(-8,58)">${animal}</g>`;
      return `<g transform="translate(${x},96) scale(${k*f},${k})">${c}</g>`; };
    over+=card(520,br,dr,bear({x:-20,y:0,s:0.4}),"DON'T RUN",'#E5383B');
    over+=card(800,mo,rn,moose({x:-10,y:12,s:0.32,flip:true}),'RUN!','#3FB27F');
    if(t>=br) over+=`<text x="520" y="205" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" opacity="${A(t,br,br+0.2)}">BEAR</text>`;
    if(t>=mo) over+=`<text x="800" y="205" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" opacity="${A(t,mo,mo+0.2)}">MOOSE</text>`;
    const rows=[[tr,'GET BEHIND A TREE OR A CAR','#F6C945','tree'],[kd,'KNOCKED DOWN? CURL UP','#fff','ball'],[cv,'COVER YOUR HEAD. STAY STILL','#E5383B','head']];
    rows.forEach(([ts,txt,bg,ic],i)=>{ if(t<ts) return; const sc=popS(t,ts); const y=290+i*100;
      over+=`<g transform="translate(0,${y})"><g transform="translate(395,0)">${tipIcon(ic,sc*0.75)}</g>${badge(700,0,txt,{sc,fs:28,bg,fg:bg==='#E5383B'?'#fff':'#2a2018'})}</g>`});
    cam={s:1.0,x:540,y:304};
  }
  else { // ===== end card
    const e0=M4.start-0.2;
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="url(#cardbg)"/>`;
    panel+=`<g opacity="${A(t,e0,e0+0.3)}"><text x="740" y="230" text-anchor="middle" font-size="98" font-weight="800" fill="#1C1A20" letter-spacing="-2">MR FINE</text>
      <text x="740" y="305" text-anchor="middle" font-size="46" font-weight="700" fill="#1f1b24" opacity="${A(t,e0+0.3,e0+0.6)}">The selfie can wait.</text>
      <g transform="translate(740,395) scale(${popS(t,P_('m4.1'))})"><text x="0" y="0" text-anchor="middle" font-size="60" font-weight="800" fill="#E86A90">YOUR LIFE CAN'T.</text></g></g>`;
    const m=fineMouth();
    fine={x:300,y:548,s:1.4,mouth:m,armR:t<P_('m4.1')?[150+Math.sin(t*14)*12,10]:[30,150],handR:t<P_('m4.1')?'':'thumb',wink:t>M4.start+M4.dur+0.4,emo:'neutral',smile:t>M4.start+M4.dur+0.3};
    cam={s:1.0,x:540,y:304};
  }
  over=under+(fine?mrFine(fine):'')+over;
  return {panel,cam,gray,over,raw,shake,rot};
}
function tipIcon(kind,sc){ if(sc<=0) return ''; let s='';
  if(kind==='tree') s=`<rect x="-7" y="6" width="14" height="28" fill="#A0784E"/><path d="M0,-36 L28,10 L-28,10Z" fill="#5E9A55" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>`;
  if(kind==='ball') s=`<circle r="28" fill="none" stroke="#fff" stroke-width="7"/><path d="M-14,-6 Q0,14 14,-6" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(kind==='head') s=`<circle cx="0" cy="6" r="20" fill="#fff"/><path d="M-30,-4 Q0,-40 30,-4" stroke="#F6C945" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  return `<g transform="scale(${sc})">${s}</g>`;
}

function stampCheck(x,y,sc){ if(sc<=0) return ''; return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="40" fill="#3FB27F" stroke="#fff" stroke-width="6"/><path d="M-18,0 L-5,14 L20,-14" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}


function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) rotate(${sc.rot||0}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;
  // banner
  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>
      <text x="540" y="548" text-anchor="middle" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1">WHAT IF YOU GET CLOSE</text>
      <text x="540" y="618" text-anchor="middle" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1">TO A MOOSE FOR A SELFIE?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
</script></body></html>
