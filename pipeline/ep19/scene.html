const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

function person(o,st){ // standing rig, origin feet

  const cam={s:mix(1.05,1.0,pk),x:mix(650,600,pk),y:mix(300,ROOMY-271,pk)}; CAM=cam;
  if(t>=b2-0.05){ const mk=popS(t,b2); over+=`<g transform="translate(${SX(700)},${SY(ROOMY-40)}) scale(${mk*1.25})"><path d="M-130,-10 L130,-10 L120,22 L-120,22Z" fill="#8A5A36" stroke="#3a2a24" stroke-width="5"/><text x="0" y="14" text-anchor="middle" font-size="24" font-weight="800" fill="#F6C945">NOT YOURS</text></g>`; }
  if(t>=p0+0.2&&t<b1+0.1) over+=badge(760,100,'UNDER THE SAND...',{sc:popS(t,p0+0.25)*(1-A(t,b1-0.1,b1+0.1)),fs:30,bg:'#fff',rot:-3});
  if(t>=b1&&t<b2) over+=badge(760,100,'MY HOME',{sc:popS(t,b1+0.05),fs:34,bg:'#F6C945',rot:3});
  return {panel,over,cam}; }
// ---------- TIP ----------
function tipIcon(kind){ let s='';
  const X=`<path d="M-30,-30 L30,30 M30,-30 L-30,30" stroke="#FF6B5E" stroke-width="6" stroke-linecap="round"/>`;
  const V=`<path d="M-14,26 L-4,36 L16,14" stroke="#7CFFB2" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(kind==='knee') s=`<circle cx="0" cy="-30" r="9" fill="#fff"/><path d="M0,-20 L0,6 M0,-14 L-12,-2 M0,-14 L12,-2 M0,6 L-8,28 M0,6 L8,28" stroke="#fff" stroke-width="5" stroke-linecap="round"/><rect x="-30" y="16" width="60" height="16" fill="#E8C98C" opacity=".9"/>`+`<g transform="translate(22,-26) scale(.7)">${V}</g>`;
  if(kind==='tunnel') s=`<path d="M-36,24 Q-36,-30 0,-30 Q36,-30 36,24Z" fill="#E8C98C"/><path d="M-14,24 Q-14,-6 0,-6 Q14,-6 14,24Z" fill="#5a3a2a"/>`+X;
  if(kind==='fill') s=`<path d="M-34,20 L34,20 L26,34 L-26,34Z" fill="#5a3a2a"/><path d="M-30,20 Q0,4 30,20" fill="#E8C98C"/><g transform="rotate(-35) translate(-6,-26)"><path d="M0,-30 L0,12" stroke="#fff" stroke-width="5"/><path d="M-10,12 L10,12 L8,28 L-8,28Z" fill="#fff"/></g>`;
  if(kind==='help') s=`<rect x="-16" y="-30" width="32" height="56" rx="7" fill="#fff"/><rect x="-11" y="-22" width="22" height="34" fill="#3FB27F"/><path d="M24,-24 q10,10 0,20 M32,-30 q16,16 0,32" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  return s; }
function tip(t){ let over='';
  const q=P_('m3.0'), tu=P_('m3.1'), fi=P_('m3.2'), st=P_('m3.3'), cl=P_('m3.4'), dj=P_('m3.5');
  over+=badge(690,64,'BEACH HOLES',{sc:popS(t,CLIP('m3').start),fs:30,bg:'#fff'});
  const tile=(x,y,ts,ic,lines,bgc,hl)=>{ if(t<ts) return ''; const k=popS(t,ts)*(hl?1.06+0.025*Math.sin(T*6):1); const fs=lines.length>2?22:25; const y0=lines.length==1?10:lines.length==2?-8:-22;
    return `<g transform="translate(${x},${y}) scale(${k})"><rect x="-176" y="-80" width="352" height="160" rx="20" fill="${bgc}" stroke="${hl?'#F6C945':'#fff'}" stroke-width="${hl?8:5}"/><g transform="translate(-116,0) scale(1.15)">${tipIcon(ic)}</g>${lines.map((l,i)=>`<text x="50" y="${y0+i*(fs+8)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${l}</text>`).join('')}</g>`; };
  over+=tile(500,200,q,'knee',['NO DEEPER','THAN YOUR KNEES'],'#3FB27F',t>=q&&t<tu);
  over+=tile(870,200,tu,'tunnel',['NEVER DIG','TUNNELS'],'#E5383B',t>=tu&&t<fi);
  over+=tile(500,380,fi,'fill',['FILL THE HOLE','BEFORE YOU GO'],'#D9682F',t>=fi&&t<st);
  over+=tile(870,380,st,'help',['STUCK? CALL','FOR HELP.','DON\'T JUMP IN'],'#3E6FC0',t>=st);
  return over; }
function scene(t){
  let panel='', cam={s:1,x:540,y:304}, gray=false, over='', fine=null, shake=0, rot=0;
  const M1=CLIP('m1'), N4=CLIP('n4'), M2=CLIP('m2'), M3=CLIP('m3'), M4=CLIP('m4');
  const pauseAt=M1.start-0.15, rwEnd=N4.start-0.05, rwStart=rwEnd-1.0;
  const fz=FZ();
  if(t<pauseAt){ const tt=Math.min(t,fz); const keep=T; if(t>fz) T=fz; const b=badPath(tt); T=keep; panel=b.panel; over=b.over; cam=CAM; shake=t<fz?b.shake:0;
    if(t>=fz) over+=`<rect width="1080" height="608" fill="#fff" opacity="${0.5*(1-A(t,fz,fz+0.25))}"/>`; }
  else if(t<rwStart){
    gray=true; const keep=T; T=fz; const b=badPath(fz); T=keep; panel=b.panel; cam=CAM;
    over+=`<g opacity="${A(t,pauseAt,pauseAt+0.2)}"><rect x="34" y="34" width="14" height="46" fill="#141218"/><rect x="58" y="34" width="14" height="46" fill="#141218"/><text x="88" y="70" font-size="30" font-weight="800" fill="#141218" stroke="#fff" stroke-width="5" paint-order="stroke">PAUSED</text></g>`;
    const v=P_('m1.1'), lk=P_('m1.2'), wl=P_('m1.3'), rw=P_('m1.4');
    if(t>=v-0.45) over+=`<rect x="330" y="0" width="750" height="608" fill="#141218" opacity="${0.9*A(t,v-0.45,v-0.05)}"/>`;
    over+=pauseDiagram(t);
    const wi=A(t,pauseAt,pauseAt+0.9), fx=mix(-120,150,wi);
    let o={x:fx,y:575,s:0.86,mouth:fineMouth(),walk:t<pauseAt+0.9?(t*2)%1:null,armL:[-8,2],armR:[40,60],handR:'remote',remoteAng:70,
      emo:t<v?'neutral':t<lk?'curious':t<rw?'serious':'neutral'};
    if(t<pauseAt+1.1&&t>=pauseAt+0.9){o.armR=[70,50];o.press=true}
    if(t>=rw){o.armR=[70,50];o.press=t>rw+0.1&&t<rw+0.5}
    fine=o;
  }
  else if(t<rwEnd){
    const k=L(t,rwStart,rwEnd); const back=mix(fz,0.3,Math.pow(k,0.8));
    const keep=T; T=back; const b=badPath(back); T=keep;
    panel=b.panel; cam=CAM; gray=k<0.4;
    over+=`<g><path d="M40,40 L60,58 L40,76Z M64,40 L84,58 L64,76Z" fill="#fff" stroke="#141218" stroke-width="3" transform="rotate(180,62,58)"/><text x="100" y="70" font-size="30" font-weight="800" fill="#fff" stroke="#141218" stroke-width="5" paint-order="stroke">REWIND</text></g>`;
    for(let i=0;i<5;i++){const yy=(i*137+t*900)%608;over+=`<rect x="0" y="${yy}" width="1080" height="${6+i%3*4}" fill="#fff" opacity=".25"/>`}
    fine={x:150,y:575,s:0.86,armR:[70,50],handR:'remote',remoteAng:70,press:true,mouth:0,emo:'neutral'};
  }
  else if(t<M2.start){ const r=rightMove(t); panel=r.panel; over=r.over; cam=r.cam; shake=r.shake;
    const a2=P_('n4.2'), f1=P_('f2.1');
    fine={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<a2?'serious':'neutral'};
    if(t>=f1-0.2){ fine.mouth=0; fine.emo='happy'; fine.armR=[30,150]; fine.handR='thumb'; }
  }
  else if(t<M3.start){ const r=punch(t); panel=r.panel; over=r.over; cam=r.cam;
    const b1=P_('m2.1'), b2=P_('m2.2');
    let f={x:150,y:575,s:0.86,mouth:fineMouth(),emo:t<b1?'curious':'neutral',smile:t>=b1&&t<b2};
    if(t>=b1&&t<b2){ f.armR=[120,-10]; f.handR='point'; }
    f.wink=t>PE('m2.2')-0.15&&t<PE('m2.2')+0.45; if(f.wink) f.smile=true;
    fine=f;
  }
  else if(t<M4.start){
    panel+=backWorld()+layers()+mound(0.55);
    panel+=`<rect x="-3200" y="-1600" width="9200" height="4000" fill="#2a2018" opacity=".86"/>`;
    over+=tip(t);
    let o={x:150,y:575,s:0.95,mouth:fineMouth(),emo:'serious'};
    if(t>=P_('m3.0')+0.3&&t<M4.start-0.3){o.armR=[120,-10];o.handR='point'}
    fine=o; cam={s:0.9,x:mix(560,660,L(t,M3.start,M4.start)),y:330};
  }
  else {
    const e0=M4.start-0.2;
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="url(#cardbg)"/>`;
    panel+=`<g opacity="${A(t,e0,e0+0.3)}"><text x="740" y="230" text-anchor="middle" font-size="98" font-weight="800" fill="#1C1A20" letter-spacing="-2">MR FINE</text>
      <text x="740" y="305" text-anchor="middle" font-size="42" font-weight="700" fill="#1f1b24" opacity="${A(t,e0+0.3,e0+0.6)}">The hole can wait.</text>
      <g transform="translate(752,390) scale(${popS(t,P_('m4.1'))})"><text x="0" y="0" text-anchor="middle" font-size="48" font-weight="800" fill="#E86A90">YOUR LIFE CAN'T.</text></g></g>`;
    const m=fineMouth();
    fine={x:300,y:548,s:1.4,mouth:m,armR:t<P_('m4.1')?[150+Math.sin(t*14)*12,10]:[30,150],handR:t<P_('m4.1')?'':'thumb',wink:t>M4.start+M4.dur+0.4,emo:'neutral',smile:t>M4.start+M4.dur+0.3};
    cam={s:1.0,x:540,y:304};
    return {panel,cam,gray,over:mrFine(fine)+over,raw:true,shake,rot};
  }
  over=(fine?mrFine(fine):'')+over;
  return {panel,cam,gray,over,shake,rot};
}

const DEFS2=`<defs><linearGradient id="beachSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EC1EE"/><stop offset=".7" stop-color="#BFE6FA"/><stop offset="1" stop-color="#E4F5FC"/></linearGradient><linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F82BE"/><stop offset="1" stop-color="#43B3E0"/></linearGradient><linearGradient id="holeShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient><clipPath id="pdc"><rect x="330" y="0" width="750" height="608"/></clipPath><radialGradient id="lampGlow2"><stop offset="0" stop-color="#FFD98A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient></defs>`;

function render(t){
  TREAL=t; T=t;
  const sc=scene(T);
  const c=sc.cam; const sh=sc.shake||0; const tr=`translate(${540+Math.sin(t*60)*sh},${304+Math.cos(t*53)*sh}) scale(${c.s}) rotate(${sc.rot||0}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS+DEFS2;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;
  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>
      <text x="540" y="548" text-anchor="middle" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1">WHAT IF YOU DIG A</text>
      <text x="540" y="618" text-anchor="middle" font-size="52" font-weight="800" fill="#fff" letter-spacing="-1">DEEP BEACH HOLE?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
</script></body></html>
