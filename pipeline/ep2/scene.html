</head><body>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ---------- helpers ----------
const OL='#3a2a24', OLF='#2a2330';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=v=>{v=clamp(v);return v*v*(3-2*v)};
const A=(t,a,b)=>sm((t-a)/(b-a));          // eased 0..1 between a and b
const L=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const pop=(t,a,d=0.35)=>{const k=clamp((t-a)/d);if(k<=0)return 0;return k>=1?1:1+Math.sin(k*Math.PI)*0.25*(1-k)+ (k<1? (k-1)*0 :0) - (1-sm(k))};
const popS=(t,a,d=0.3)=>{const k=clamp((t-a)/d);if(k<=0)return 0;return sm(k)*(1+0.18*Math.sin(k*Math.PI))};
const n1=(t,s=1)=>Math.sin(t*1.7*s)*0.5+Math.sin(t*2.9*s+1.3)*0.3+Math.sin(t*5.3*s+0.7)*0.2;
let T=0, FR=0, TREAL=0;
function warpT(t){const P=TL.warp;for(let i=0;i<P.length-1;i++){const [a,oa]=P[i],[b,ob]=P[i+1];if(t<=b)return oa+(t-a)*(ob-oa)/Math.max(1e-6,b-a)}return P[P.length-1][1]}
function envOf(k){const e=TL.env[k];const i=Math.round(TREAL*30);return e[i]||0}
function fineMouth(){return Math.max(envOf('fine'),envOf('nar'))}
function blinkAt(t,seed){const p=(t+seed*1.37)%3.7;return p<0.12?1:0}
function g(tr,inner,extra=''){return `<g transform="${tr}" ${extra}>${inner}</g>`}

// ---------- arm ----------
function arm(sx,sy,a1,a2,col,skin,l1=50,l2=46,w=24,hand=''){
  const r=Math.PI/180;const ex=sx+Math.sin(a1*r)*l1, ey=sy+Math.cos(a1*r)*l1;
  const hx=ex+Math.sin((a1+a2)*r)*l2, hy=ey+Math.cos((a1+a2)*r)*l2;
  const p=`M${sx},${sy} L${ex},${ey} L${hx},${hy}`;
  return {svg:`<path d="${p}" fill="none" stroke="${OL}" stroke-width="${w+8}" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${p}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="${hx}" cy="${hy}" r="13" fill="${skin}" stroke="${OL}" stroke-width="4"/>${hand}`,hx,hy};
}
// ---------- props ----------
function matchStick(x,y,ang,fl,t){ // fl flame 0..1
  let s=`<g transform="translate(${x},${y}) rotate(${ang})"><rect x="-3" y="-44" width="6" height="44" rx="2" fill="#E9C58A" stroke="${OL}" stroke-width="2"/><circle cx="0" cy="-46" r="6" fill="#C8382E" stroke="${OL}" stroke-width="2"/>`;
  if(fl>0){const f=0.8+0.2*Math.sin(t*23);s+=`<g transform="translate(0,-50) scale(${fl*f})"><path d="M0,-34 C10,-18 12,-6 0,4 C-12,-6 -10,-18 0,-34Z" fill="#FF8A1F"/><path d="M0,-22 C6,-12 7,-4 0,2 C-7,-4 -6,-12 0,-22Z" fill="#FFD84A"/></g>`}
  return s+'</g>';
}
function matchBox(x,y,rot=0,open=0,s=1){
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})"><rect x="-26" y="-17" width="52" height="34" rx="4" fill="#E2463A" stroke="${OL}" stroke-width="3"/>
  <rect x="${-26+open*22}" y="-14" width="44" height="28" rx="3" fill="#F3E3C4" stroke="${OL}" stroke-width="2" opacity="${open>0?1:0}"/>
  <rect x="-18" y="-8" width="36" height="16" rx="3" fill="#FFD23F" stroke="${OL}" stroke-width="2"/><path d="M0,-5 C4,0 3,4 0,6 C-3,4 -4,0 0,-5Z" fill="#E2463A"/></g>`;
}
function flame(x,y,h,t,seed=0){ // base at x,y, height h
  if(h<=1)return '';
  const f=k=>1+0.12*Math.sin(t*(9+k)+seed+k*2);
  const w=h*0.55;
  const tongue=(sc,col,k)=>{const hh=h*sc*f(k), ww=w*sc;const sway=Math.sin(t*6+seed+k)*ww*0.18;
    return `<path d="M${x-ww},${y} C${x-ww*1.05},${y-hh*0.45} ${x-ww*0.3+sway},${y-hh*0.6} ${x+sway*1.6},${y-hh} C${x+ww*0.35+sway},${y-hh*0.55} ${x+ww*1.05},${y-hh*0.4} ${x+ww},${y} Z" fill="${col}"/>`};
  return `<g>${tongue(1,'#E8452C',1)}${tongue(0.78,'#FF8A1F',2)}${tongue(0.5,'#FFD23F',3)}</g>`;
}
function smokePuffs(x,y,w,t,dens,seed=0){let s='';for(let i=0;i<9;i++){const px=x+((i*97+seed*31)%w)+Math.sin(t*0.6+i)*14, py=y-((t*22+i*40+seed*13)%140), r=26+(i%4)*9;
  s+=`<circle cx="${px}" cy="${py}" r="${r}" fill="#55545a" opacity="${0.45*dens*(1-((t*22+i*40+seed*13)%140)/170)}"/>`}return s}

// ---------- characters ----------
const KID={skin:'#E8B48A',hair:'#6B3E26',top:'#3E6FC0',pants:'#2D3550',shoe:'#F4F1EC',hairStyle:'curly'};
const MOM={skin:'#F0C29C',hair:'#A0452E',top:'#5DA26E',pants:'#4A3B5C',shoe:'#7A4A3A',hairStyle:'bun'};
function face(o,st){
  const lx=o.lookX||0, ly=o.lookY||0, f=o.face||'neutral', blink=o.blink||0;
  let s='';
  // eyes
  const eye=(ex,wide,wink)=>{
    if(blink||wink) return `<path d="M${ex-11},-238 Q${ex},-232 ${ex+11},-238" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
    if(f==='happy') return `<path d="M${ex-12},-236 Q${ex},-250 ${ex+12},-236" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/>`;
    if(f==='bored') return `<circle cx="${ex}" cy="-238" r="11" fill="#fff" stroke="${OL}" stroke-width="3.5"/><circle cx="${ex+lx}" cy="${-235+ly}" r="5.5" fill="${OL}"/><path d="M${ex-13},-240 L${ex+13},-240 L${ex+13},-252 L${ex-13},-252Z" fill="${st.skin}"/><path d="M${ex-12},-240 L${ex+12},-240" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
    const r=wide?15:11.5, pr=wide?4.5:6;
    return `<circle cx="${ex}" cy="-238" r="${r}" fill="#fff" stroke="${OL}" stroke-width="3.5"/><circle cx="${ex+lx}" cy="${-238+ly}" r="${pr}" fill="${OL}"/><circle cx="${ex+lx+2}" cy="${-240+ly}" r="1.6" fill="#fff"/>`;
  };
  const wide=['panic','scared','shock','yell','spark'].includes(f);
  s+=eye(-23,wide,o.winkL)+eye(23,wide,false);
  // brows
  const bt={neutral:[0,0],happy:[-3,0],grin:[-4,0],panic:[-10,14],scared:[-8,12],shock:[-12,4],yell:[-2,-12],sheepish:[-6,10],bored:[2,-4],spark:[-10,0],proud:[-6,-4],suspicious:[0,-10]}[f]||[0,0];
  s+=`<path d="M-34,${-258+bt[0]} L-13,${-258+bt[0]-bt[1]*0.35}" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>
      <path d="M34,${-258+bt[0]} L13,${-258+bt[0]-bt[1]*0.35}" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  if(f==='suspicious') s=s.replace(/M34,(-?[\d.]+) L13/,'M34,-252 L13');
  // blush
  s+=`<ellipse cx="-40" cy="-214" rx="11" ry="6" fill="#F08A8A" opacity=".45"/><ellipse cx="40" cy="-214" rx="11" ry="6" fill="#F08A8A" opacity=".45"/>`;
  // mouth
  const m=o.mouth||0;
  if(m>0.06) s+=`<ellipse cx="0" cy="-204" rx="${8+m*6}" ry="${3+m*11}" fill="#7A2E2E" stroke="${OL}" stroke-width="3.5"/>`;
  else if(f==='grin'||f==='spark') s+=`<path d="M-17,-210 Q0,-188 17,-210 Z" fill="#7A2E2E" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/>`;
  else if(f==='panic'||f==='scared'||f==='shock') s+=`<ellipse cx="0" cy="-203" rx="7" ry="9" fill="#7A2E2E" stroke="${OL}" stroke-width="3.5"/>`;
  else if(f==='sheepish') s+=`<path d="M-14,-205 Q-7,-200 0,-205 Q7,-210 14,-205" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  else if(f==='bored'||f==='suspicious') s+=`<path d="M-11,-204 L11,-204" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  else s+=`<path d="M-13,-208 Q0,-196 13,-208" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  if(o.sweat) s+=`<path d="M48,-262 C53,-252 55,-246 48,-242 C41,-246 43,-252 48,-262Z" fill="#9FD6F5" stroke="${OL}" stroke-width="2.5"/>`;
  return s;
}
function head(o,st){
  let s='';const hs=st.hairStyle;
  if(hs==='bun') s+=`<circle cx="0" cy="-312" r="26" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`;
  if(hs==='bun') s+=`<path d="M-66,-236 C-72,-170 -60,-150 -40,-150 L40,-150 C60,-150 72,-170 66,-236Z" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`;
  s+=`<circle cx="-64" cy="-232" r="11" fill="${st.skin}" stroke="${OL}" stroke-width="4"/><circle cx="64" cy="-232" r="11" fill="${st.skin}" stroke="${OL}" stroke-width="4"/>`;
  s+=`<ellipse cx="0" cy="-236" rx="64" ry="62" fill="${st.skin}" stroke="${OL}" stroke-width="4.5"/>`;
  if(hs==='curly'){let c='';for(let i=0;i<9;i++){const a=Math.PI*(1.05+i*0.11);c+=`<circle cx="${Math.cos(a)*54}" cy="${-246+Math.sin(a)*50}" r="${21+(i%2)*3}" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`}
    s+=c+`<path d="M-58,-262 C-50,-300 50,-300 58,-262 C40,-276 10,-268 0,-262 C-14,-276 -40,-276 -58,-262Z" fill="${st.hair}"/><path d="M-12,-292 q10,-8 22,-2" stroke="#8C5A3C" stroke-width="5" fill="none" stroke-linecap="round"/>`}
  if(hs==='bun') s+=`<path d="M-64,-246 C-60,-300 60,-300 64,-246 C40,-268 -10,-272 -64,-246Z" fill="${st.hair}" stroke="${OL}" stroke-width="4"/>`;
  return s+face(o,st);
}
function person(o,st){ // standing rig, origin feet
  const t=T, s=o.s||1, bob=Math.sin(t*2.2+(o.seed||0))*2.2;
  const wk=o.walk!=null? o.walk:null;
  let legs='';
  const legX=[-18,18];
  legX.forEach((lx,i)=>{const sw=wk!=null? Math.sin(wk*Math.PI*2+i*Math.PI)*16:0; const lift=wk!=null? Math.max(0,Math.sin(wk*Math.PI*2+i*Math.PI))*8:0;
    legs+=`<path d="M${lx},-66 L${lx+sw},${-6-lift}" stroke="${OL}" stroke-width="32" stroke-linecap="round"/><path d="M${lx},-66 L${lx+sw},${-6-lift}" stroke="${st.pants}" stroke-width="24" stroke-linecap="round"/><ellipse cx="${lx+sw+4}" cy="${-4-lift}" rx="19" ry="10" fill="${st.shoe}" stroke="${OL}" stroke-width="4"/>`});
  const lean=o.lean||0, slump=o.slump||0, sh=o.shake?Math.sin(t*40)*3*o.shake:0;
  const aL=o.armL||[12,10], aR=o.armR||[-12,-10];
  const rA=arm(-44,-158+slump*6,aL[0],aL[1],st.top,st.skin,50,46,24,o.handL||'');
  const rB=arm(44,-158+slump*6,aR[0],aR[1],st.top,st.skin,50,46,24,'');
  let body=`<rect x="-48" y="${-176+slump*5}" width="96" height="116" rx="30" fill="${st.top}" stroke="${OL}" stroke-width="4.5"/>
    <path d="M-16,${-174+slump*5} L0,${-156+slump*5} L16,${-174+slump*5}" fill="none" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/>`;
  if(st===MOM) body+=`<path d="M0,-156 L0,-62" stroke="${OL}" stroke-width="3" opacity=".5"/>`;
  const behind=o.armLBehind?rA.svg:'';
  const front=(o.armLBehind?'':rA.svg)+rB.svg;
  const hold=o.holdR?o.holdR(rB.hx,rB.hy):'';
  const holdL=o.holdL?o.holdL(rA.hx,rA.hy):'';
  const hd=g(`translate(0,${slump*8}) rotate(${(o.tilt||0)})`,head(o,st));
  const inner=behind+legs+body+hd+front+hold+holdL;
  return g(`translate(${o.x+sh},${o.y}) scale(${(o.flip?-1:1)*s},${s}) rotate(${lean}) translate(0,${bob})`,inner);
}
function kidCrawl(o){ // crawling, facing right
  const t=T, st=KID, ph=(o.ph||0)*Math.PI*2, s=o.s||1;
  const k1=Math.sin(ph)*14, k2=Math.sin(ph+Math.PI)*14;
  let svg='';
  const limb=(x1,y1,x2,y2,c,w)=>`<path d="M${x1},${y1} L${x2},${y2}" stroke="${OL}" stroke-width="${w+8}" stroke-linecap="round"/><path d="M${x1},${y1} L${x2},${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  svg+=limb(-50,-70,-40+k2,-8,st.pants,24)+limb(-40+k2,-8,-95+k2,-8,st.pants,24);
  svg+=limb(40,-78,52+k1,-8,st.top,22)+`<circle cx="${52+k1}" cy="-8" r="12" fill="${st.skin}" stroke="${OL}" stroke-width="4"/>`;
  svg+=`<ellipse cx="0" cy="-82" rx="70" ry="38" fill="${st.top}" stroke="${OL}" stroke-width="4.5"/>`;
  svg+=limb(-50,-70,-40+k1,-8,st.pants,24)+limb(-40+k1,-8,-95+k1,-8,st.pants,24);
  svg+=limb(40,-78,52+k2,-8,st.top,22)+`<circle cx="${52+k2}" cy="-8" r="12" fill="${st.skin}" stroke="${OL}" stroke-width="4"/>`;
  svg+=g(`translate(118,128) scale(.78)`,head({face:o.face||'scared',lookX:5,mouth:o.mouth||0,blink:o.blink},st));
  return g(`translate(${o.x},${o.y}) scale(${s})`,svg);
}
function kidHug(o){ // sitting hugging knees
  const st=KID,s=o.s||1,cough=o.cough||0;
  let svg=`<ellipse cx="0" cy="-6" rx="70" ry="12" fill="#000" opacity=".25"/>`;
  svg+=`<rect x="-46" y="-150" width="92" height="110" rx="30" fill="${st.top}" stroke="${OL}" stroke-width="4.5"/>`;
  svg+=`<path d="M-30,-40 L10,-110 L40,-20" fill="none" stroke="${OL}" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30,-40 L10,-110 L40,-20" fill="none" stroke="${st.pants}" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg+=`<ellipse cx="44" cy="-14" rx="19" ry="10" fill="${st.shoe}" stroke="${OL}" stroke-width="4"/>`;
  svg+=`<path d="M-40,-130 C-10,-95 20,-95 30,-104" fill="none" stroke="${OL}" stroke-width="32" stroke-linecap="round"/><path d="M-40,-130 C-10,-95 20,-95 30,-104" fill="none" stroke="${st.top}" stroke-width="24" stroke-linecap="round"/><circle cx="30" cy="-104" r="13" fill="${st.skin}" stroke="${OL}" stroke-width="4"/>`;
  svg+=g(`translate(0,${40-cough*8}) rotate(${-cough*6})`,head({face:o.face||'scared',lookX:o.lookX||4,mouth:o.mouth||0,blink:o.blink,sweat:1},st));
  return g(`translate(${o.x},${o.y}) scale(${s})`,svg);
}
function mrFine(o){ // traced from Episode 1 end card (coords: feet at 215,692)
  const t=T, S=(o.s||0.9)*0.37, bob=Math.sin(t*2.6)*6;
  const m=o.mouth||0, emo=o.emo||'neutral';
  const OL='#23202A', BONE='#EEE9E6', HOOD='#3B3448', HEM='#28232F', PINK='#E48AA5', PINKD='#C96E8C';
  const W=11;
  const aL=o.armL||[-11,0], aR=o.armR||[11,0];
  const armF=(sx,a)=>{const r=Math.PI/180;const sy=420;const ex=sx+Math.sin(a[0]*r)*74,ey=sy+Math.cos(a[0]*r)*74,hx=ex+Math.sin((a[0]+a[1])*r)*84,hy=ey+Math.cos((a[0]+a[1])*r)*84;const p=`M${sx},${sy} L${ex},${ey} L${hx},${hy}`;
    return {s:`<path d="${p}" fill="none" stroke="${OL}" stroke-width="${52+W*2}" stroke-linecap="round" stroke-linejoin="round"/><path d="${p}" fill="none" stroke="${HOOD}" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>`,hx,hy}};
  const L_=armF(108,aL), R_=armF(330,aR);
  const hand=(h,kind,side)=>{
    if(kind==='thumb') return `<g transform="translate(${h.hx},${h.hy}) scale(${side},1)"><rect x="-30" y="-24" width="60" height="54" rx="22" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/><rect x="-24" y="-72" width="26" height="56" rx="13" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/></g>`;
    if(kind==='point') return `<g transform="translate(${h.hx},${h.hy})"><rect x="-11" y="-74" width="22" height="52" rx="11" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/><circle r="33" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/></g>`;
    if(kind==='remote') return `<g transform="translate(${h.hx},${h.hy}) rotate(-12)"><rect x="-24" y="-100" width="48" height="104" rx="12" fill="#2A2730" stroke="${OL}" stroke-width="7"/><circle cx="0" cy="-78" r="11" fill="${o.press?'#ff7b7b':'#E2463A'}"/><rect x="-13" y="-56" width="26" height="7" fill="#8a8590"/><rect x="-13" y="-42" width="26" height="7" fill="#8a8590"/><circle r="33" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/></g>`;
    return `<circle cx="${h.hx}" cy="${h.hy}" r="33" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/>`;
  };
  let sv=`<ellipse cx="215" cy="752" rx="190" ry="34" fill="#7d766d" opacity=".28" filter="url(#mfblur)"/><ellipse cx="215" cy="690" rx="150" ry="16" fill="#8a837a" opacity=".35"/>`;
  [[165,150],[260,275]].forEach(([lx,fx],i)=>{const sw=o.walk!=null?Math.sin(o.walk*Math.PI*2+i*Math.PI)*20:0;
    sv+=`<rect x="${lx-15+sw*0.4}" y="585" width="30" height="62" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/><ellipse cx="${fx+sw}" cy="660" rx="52" ry="30" fill="${BONE}" stroke="${OL}" stroke-width="${W}"/>`});
  sv+=`<path d="M106,540 L334,540 L336,584 Q336,598 322,598 L120,598 Q104,598 104,584 Z" fill="${PINK}" stroke="${OL}" stroke-width="${W}" stroke-linejoin="round"/><rect x="124" y="566" width="80" height="10" rx="4" fill="${PINKD}"/><rect x="236" y="566" width="80" height="10" rx="4" fill="${PINKD}"/><path d="M220,544 L220,596" stroke="${OL}" stroke-width="8"/>`;
  sv+=L_.s;
  sv+=`<path d="M134,388 Q104,392 100,440 L94,518 Q92,548 118,548 L326,548 Q350,548 348,518 L342,440 Q338,392 310,388 Z" fill="url(#mfhood)" stroke="${OL}" stroke-width="${W}" stroke-linejoin="round"/>`;
  sv+=`<path d="M96,512 L346,512 L348,524 Q350,544 326,544 L118,544 Q94,544 94,524 Z" fill="${HEM}"/>`;
  sv+=`<rect x="183" y="400" width="12" height="20" rx="4" fill="#E8E3EA"/><rect x="243" y="400" width="12" height="20" rx="4" fill="#E8E3EA"/>`;
  sv+=`<g transform="translate(220,470) scale(.7)"><path d="M-62,10 C-78,6 -76,-24 -56,-28 C-58,-50 -28,-56 -16,-42 C-6,-58 22,-56 26,-38 C48,-46 62,-22 50,-8 C68,4 58,34 36,30 C30,48 2,48 -4,34 C-18,48 -48,42 -46,24 C-62,26 -70,16 -62,10Z" fill="#EE93AE" stroke="#C76487" stroke-width="5"/><path d="M0,-40 C-8,-14 8,6 0,38 M-40,-10 C-26,-6 -24,8 -34,14 M38,-14 C24,-8 24,6 36,12" stroke="#C76487" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="-28" cy="-26" rx="8" ry="5" fill="#fff" opacity=".7"/></g>`;

  if(!c) return '';
  const C=CAPC[c.spk];let parts='';
  c.words.forEach(([w,a,b])=>{const col=t>=a&&t<b+0.02?C.cur:(t>=b?C.past:C.fut);parts+=`<tspan fill="${col}">${w.replace(/&/g,'&amp;')} </tspan>`});
  const k=clamp((t-c.start+0.05)/0.12);
  return `<g transform="translate(540,1352) scale(${0.9+0.1*k})" opacity="${k}"><text x="0" y="0" text-anchor="middle" font-size="50" font-weight="800" stroke="#000" stroke-width="10" stroke-linejoin="round" paint-order="stroke" letter-spacing="0.5">${parts}</text></g>`;
}

  if(t>=14.0){o.face='shock';}

    fine={x:150,y:575,s:0.86,mouth:m,emo:t<79.8?'worried':'happy',armR:t>=79.8?[30,150]:[11,0],handR:t>=80.4?'thumb':''};
    cam={s:t<78.3?1.3:1.08,x:t<78.3?mix(640,760,A(t,76.5,78.3)):640,y:t<78.3?330:304};
  }
  // ===== S8 punchline 81.6-95.9
  else if(t<95.9){
    panel+=kitchenRoom({boxOnShelf:true,drawer:0});
    const mw=A(t,81.6,82.8); const mx=mix(1150,830,mw);
    const mm=envOf('mom'), km=envOf('kid');
    let mface='neutral', look=0, mly=0;
    if(t>=82.4&&t<87){mface='suspicious';look=-6;mly=-6}
    if(t>=87){mface='happy'}
    panel+=person({x:mx,y:540,s:0.95,face:mface,mouth:mm,walk:t<82.8?(t*1.8)%1:null,lookX:look,lookY:mly,tilt:t>82.6&&t<87?-8:0,armL:[20,10],armR:t<84.4?[-20,-30]:[-14,-8],seed:3,blink:blinkAt(t,3),holdR:t<84.4?(hx,hy)=>`<path d="M${hx-30},${hy-6} L${hx+30},${hy-6} L${hx+24},${hy+56} L${hx-24},${hy+56}Z" fill="#D9B07A" stroke="${OL}" stroke-width="4"/><circle cx="${hx-8}" cy="${hy-14}" r="12" fill="#E5383B" stroke="${OL}" stroke-width="3"/><path d="M${hx+10},${hy-6} L${hx+16},${hy-34}" stroke="#5E9B62" stroke-width="8" stroke-linecap="round"/>`:null},MOM);
    if(t>=84.4) panel+=`<path d="M940,470 L1000,470 L995,528 L945,528Z" fill="#D9B07A" stroke="${OL}" stroke-width="4"/>`;
    let kface='sheepish', aR=[-14,-8];
    if(t>=86.9&&t<89.4){kface='proud';aR=[-40,-100]}
    panel+=person({x:650,y:520,s:0.86,face:kface,mouth:km,flip:true,armR:aR,armL:[12,10],seed:1,blink:blinkAt(t,1)},KID);
    if(t>=82.6&&t<86.6) panel+=`<circle cx="440" cy="136" r="${40+Math.sin(t*6)*3}" fill="none" stroke="#FFD23F" stroke-width="6"/>`;
    const m=fineMouth();
    let o={x:150,y:575,s:0.86,mouth:m,emo:t<86.9?'curious':'happy'};
    if(t>=89.4&&t<91.2){o.armL=[-130,-30]}
    if(t>=91.1&&t<94.6){o.armL=[-130,-30];o.armR=[130,30]}
    if(t>=94.6){o.armR=[30,150];o.handR='thumb';o.thumbDir=1;o.wink=t>94.8&&t<95.6;o.smile=true}
    fine=o;
    if(t>=89.4&&t<95.8){ over+=badge(460,60,'BORING SATURDAY? ✓',{sc:popS(t,89.5),fs:26,bg:'#fff'}); if(t>=91.0) over+=badge(800,60,'HOUSE STANDING? ✓',{sc:popS(t,91.1),fs:26,bg:'#fff'}); }
    cam={s:1.25+A(t,81.6,95.9)*0.06,x:mix(720,660,A(t,81.6,89)),y:300};
  }
  // ===== S9 tip 95.9-106.9
  else if(t<106.9){
    panel+=kitchenRoom({drawer:0,boxOnShelf:true});
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="#1b1622" opacity=".78" transform="scale(2) translate(-270,-150)"/>`;
    const m=fineMouth();
    let o={x:150,y:575,s:0.95,mouth:m,emo:t<99.3?'serious':t<101.4?'happy':'serious'};
    if(t>=96.3&&t<98.4){o.armR=[120,-10];o.handR='point'}
    if(t>=99.3&&t<101.0){o.armR=[90,10]}
    if(t>=102.2&&t<106.7){o.armR=[120,-10];o.handR='point'}
    fine=o;
    const rows=[[96.35,"NOT TOYS",'#fff',()=>icon('match',-34,-4,.9)+icon('lighter',34,4,.9)+stampX(0,0,38,popS(t,96.9))],
                [99.35,'GIVE TO AN ADULT','#fff',()=>icon('give',0,0,.8)],
                [102.26,'GET LOW · GET OUT · STAY OUT','#F6C945',()=>''],
                [104.98,'CALL THE FIREFIGHTERS','#E5383B',()=>icon('truck',0,0,.6)]];
    rows.forEach(([ts,txt,bg,ic],i)=>{ if(t<ts) return; const sc=popS(t,ts); const y=95+i*138;
      over+=`<g transform="translate(0,${y})">${ic().length?`<g transform="translate(470,0)">${g(`scale(${sc*1.1})`,ic())}</g>`:''}${badge(780,0,txt,{sc,fs:i==2?26:30,bg,fg:bg==='#E5383B'?'#fff':'#2a2018'})}</g>`});
    cam={s:1.0,x:540,y:304};
  }
  // ===== S10 end card
  else {
    panel+=`<rect x="0" y="0" width="1080" height="608" fill="url(#cardbg)"/>`;
    panel+=`<g opacity="${A(t,106.9,107.2)}"><text x="740" y="230" text-anchor="middle" font-size="98" font-weight="800" fill="#1C1A20" letter-spacing="-2">MR FINE</text>
      <text x="740" y="300" text-anchor="middle" font-size="46" font-weight="700" fill="#1f1b24" opacity="${A(t,107.1,107.4)}">Matches can wait.</text>
      <g transform="translate(740,376) scale(${popS(t,108.3)})"><text x="0" y="0" text-anchor="middle" font-size="60" font-weight="800" fill="#E86A90">YOUR LIFE CAN'T.</text></g></g>`;
    const m=fineMouth();
    fine={x:300,y:548,s:1.4,mouth:m,armR:t<108.3?[150+Math.sin(t*14)*12,10]:[30,150],handR:t<108.3?'':'thumb',wink:t>108.4,emo:'neutral',smile:t>108.3};
    cam={s:1.0+A(t,106.9,113.4)*0.03,x:540,y:304};
  }
  if(fine) over=mrFine(fine)+over;  // Mr Fine sits in panel space but outside camera zoom
  return {panel,cam,gray,over};
}

function render(t){
  TREAL=t; T=warpT(t);
  const sc=scene(T);
  const c=sc.cam; const tr=`translate(540,304) scale(${c.s}) translate(${-c.x},${-c.y})`;
  let base=g(tr,sc.panel);
  if(sc.gray) base=`<g filter="url(#gray)">${base}</g><rect width="1080" height="608" fill="url(#scan)"/>`;
  let panelInner=base+sc.over;
  const tilt=sc.gray? -0.6:0;
  let s=DEFS;
  s+=`<rect width="1080" height="1920" fill="#08070a"/>`;
  s+=`<g transform="translate(0,652) rotate(${tilt},540,304)"><g clip-path="url(#pc)">${panelInner}</g></g>`;
  // banner
  s+=`<rect x="160" y="474" width="760" height="172" rx="12" fill="#DC273B"/>
      <text x="540" y="548" text-anchor="middle" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">WHAT HAPPENS IF YOU</text>
      <text x="540" y="620" text-anchor="middle" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">PLAY WITH MATCHES?</text>`;
  s+=captions(t);
  document.getElementById('v').innerHTML=s;
}
window.render=render;
</script></body></html>
